<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FF7A45" />
<title>PetVida — Cuide bem do seu melhor amigo</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
input,select,textarea{outline:none}
ul{margin:0;padding:0;list-style:none}
:root{
  --bg:#F4F6FB;--card:#FFFFFF;--txt:#1B2434;--muted:#7B879C;--line:#EAEEF6;
  --primary:#FF7A45;--primary-d:#F05A1E;--primary-soft:#FFF0E8;
  --secondary:#25C2B0;--secondary-soft:#E4F8F5;
  --accent:#FFB020;--accent-soft:#FFF6E2;
  --danger:#EF476F;--danger-soft:#FFE9EF;
  --blue:#4A7DFF;--blue-soft:#EAF0FF;
  --purple:#9B5DE5;--purple-soft:#F3EAFE;
  --radius:20px;--radius-sm:14px;
  --shadow:0 6px 22px rgba(27,36,52,.07);
  --shadow-lg:0 14px 40px rgba(27,36,52,.16);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --tab-h: 68px;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.app-header{position:relative;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px;background:linear-gradient(140deg,#FF8A5B 0%,#FF6B35 55%,#F0521B 100%);color:#fff;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(240,90,30,.28);flex-shrink:0}
.app-header::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.10)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;backdrop-filter:blur(6px)}
.hdr-logo svg{width:22px;height:22px;fill:#fff}
.hdr-title{font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.hdr-sub{font-size:11.5px;opacity:.85;font-weight:500}
.hdr-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.20);display:grid;place-items:center;backdrop-filter:blur(6px);transition:transform .15s ease;position:relative}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.32)}
.icon-btn svg{width:19px;height:19px;fill:#fff}
.icon-btn .badge-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#25C2B0;border:2px solid rgba(255,255,255,.9)}
.hdr-stats{display:flex;gap:9px;margin-top:14px;position:relative;z-index:2}
.stat{flex:1;background:rgba(255,255,255,.17);border-radius:14px;padding:9px 10px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16)}
.stat-n{font-size:17px;font-weight:800;line-height:1}
.stat-l{font-size:10px;opacity:.88;margin-top:3px;font-weight:600;letter-spacing:.2px}
.swiper{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--tab-h) + var(--safe-b) + 26px);scrollbar-width:none;display:none}
.page.active{display:block;animation:pageSlide .3s cubic-bezier(.32,.72,.28,1)}
.page.chat-page{padding:0 0 calc(var(--tab-h) + var(--safe-b))}
@keyframes pageSlide{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
.page::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;align-items:stretch;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(27,36,52,.06)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9AA6B8;position:relative;transition:color .2s ease;padding-top:6px}
.tab svg{width:18px;height:18px;fill:currentColor;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.tab span{font-size:8.5px;font-weight:700;letter-spacing:.1px}
.tab.active{color:var(--primary)}
.tab.active svg{transform:translateY(-2px) scale(1.1)}
.tab.active::after{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}
.tab.ia-tab.active{color:#9B5DE5}
.tab.ia-tab.active::after{background:#9B5DE5}
.tab.ia-tab .ia-dot{position:absolute;top:8px;right:calc(50% - 14px);width:6px;height:6px;border-radius:50%;background:#9B5DE5;animation:pulse2 2s infinite}
@keyframes pulse2{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.2)}}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}
.sec-head:first-child{margin-top:2px}
.sec-title{font-size:15.5px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.sec-title .dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.sec-link{font-size:12px;font-weight:700;color:var(--primary);padding:4px 0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;border:1px solid rgba(234,238,246,.9)}
.empty-hero{background:linear-gradient(140deg,#FFFFFF,#FFF7F2);border:1.5px dashed #FFD3BC;border-radius:var(--radius);padding:26px 20px;text-align:center;box-shadow:var(--shadow)}
.empty-emoji{font-size:44px;line-height:1;margin-bottom:10px;display:block}
.empty-hero h3{margin:0 0 6px;font-size:16px;font-weight:800}
.empty-hero p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:800;transition:transform .13s ease;width:100%}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#FF8A5B,#F0521B);color:#fff;box-shadow:0 8px 20px rgba(240,90,30,.30)}
.btn-ghost{background:var(--primary-soft);color:var(--primary-d)}
.btn-soft{background:#F1F4F9;color:var(--txt)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-purple{background:linear-gradient(135deg,#9B5DE5,#B585F0);color:#fff;box-shadow:0 8px 20px rgba(155,93,229,.30)}
.btn-sm{padding:10px 15px;font-size:12.5px;width:auto;border-radius:12px}
.btn svg{width:17px;height:17px;fill:currentColor}
.pet-card{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow);margin-bottom:11px;border:1px solid rgba(234,238,246,.9);transition:transform .14s ease;position:relative;overflow:hidden}
.pet-card:active{transform:scale(.985)}
.pet-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--primary),var(--accent))}
.pet-avatar{width:54px;height:54px;border-radius:17px;flex-shrink:0;display:grid;place-items:center;font-size:27px;background:linear-gradient(140deg,#FFE3D4,#FFD0BB);box-shadow:inset 0 -2px 6px rgba(240,90,30,.10);overflow:hidden}
.pet-avatar.cat{background:linear-gradient(140deg,#DDF6F2,#C6EFE9)}
.pet-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.pet-info{flex:1;min-width:0}
.pet-name{font-size:15px;font-weight:800;letter-spacing:-.2px}
.pet-meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet-badges{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.badge{font-size:9.5px;font-weight:800;padding:3.5px 8px;border-radius:8px;letter-spacing:.2px;text-transform:uppercase}
.badge-ok{background:var(--secondary-soft);color:#12897A}
.badge-warn{background:var(--accent-soft);color:#B47800}
.badge-late{background:var(--danger-soft);color:#C42B50}
.badge-info{background:var(--blue-soft);color:#3157C9}
.badge-purple{background:var(--purple-soft);color:#6B31B8}
.badge-neutro{background:#F1F4F9;color:#66738A}
.pet-chevron{color:#C7CFDD;flex-shrink:0}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);width:56px;height:56px;border-radius:19px;z-index:35;background:linear-gradient(135deg,#FF8A5B,#F0521B);display:grid;place-items:center;box-shadow:0 12px 28px rgba(240,90,30,.42)}
.fab svg{width:26px;height:26px;fill:#fff}
.next-card{background:linear-gradient(140deg,#FFFFFF,#FFF6F0);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid #FFE3D4;display:flex;gap:13px;align-items:flex-start}
.next-card.alerta{background:linear-gradient(140deg,#FFFFFF,#FFF0F4);border-color:#FFD5E0}
.next-icon{width:46px;height:46px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;background:var(--primary-soft);font-size:21px}
.next-card.alerta .next-icon{background:var(--danger-soft)}
.next-body{flex:1;min-width:0}
.next-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--primary-d)}
.next-card.alerta .next-label{color:var(--danger)}
.next-title{font-size:14.5px;font-weight:800;margin-top:3px;letter-spacing:-.2px}
.next-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.next-date{font-size:11px;font-weight:800;margin-top:7px;color:var(--primary-d)}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.quick{background:var(--card);border-radius:var(--radius-sm);padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.quick:active{transform:scale(.94)}
.quick-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.quick span{font-size:9.5px;font-weight:800;color:#4C5768;text-align:center;line-height:1.2}
.tip-card{background:linear-gradient(135deg,#1F2A3D,#2B3A52);border-radius:var(--radius);padding:17px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tip-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:8px;margin-bottom:9px}
.tip-card h4{margin:0 0 6px;font-size:14.5px;font-weight:800}
.tip-card p{margin:0;font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.82)}
.search-wrap{position:relative;margin-bottom:13px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:#A9B3C4}
.search-input{width:100%;padding:13px 14px 13px 41px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
.search-input:focus{border-color:var(--primary)}
.seg{display:flex;gap:5px;background:#E9EDF5;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 8px;border-radius:11px;font-size:12.5px;font-weight:800;color:#7B879C;transition:all .22s ease}
.seg button.active{background:#fff;color:var(--primary-d);box-shadow:0 3px 10px rgba(27,36,52,.10)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:13px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:11px;font-size:12px;font-weight:700;background:var(--card);border:1.5px solid var(--line);color:#66738A}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(255,122,69,.32)}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:10px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav-btn{flex-shrink:0;padding:9px 14px;border-radius:12px;font-size:11.5px;font-weight:800;background:#fff;border:1.5px solid var(--line);color:#66738A;display:flex;align-items:center;gap:5px}
.subnav-btn.active{background:linear-gradient(135deg,#FF8A5B,#F0521B);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(240,90,30,.30)}
.breed-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.breed-card{background:var(--card);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);text-align:left}
.breed-card:active{transform:scale(.96)}
.breed-top{height:110px;display:grid;place-items:center;position:relative;overflow:hidden}
.breed-top svg.raca-svg{width:100%;height:100%;display:block}
.breed-top .breed-emoji-badge{position:absolute;top:8px;left:8px;font-size:14px;background:rgba(255,255,255,.92);width:26px;height:26px;border-radius:9px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(27,36,52,.08);z-index:2}
.breed-porte{position:absolute;top:8px;right:8px;font-size:8.5px;font-weight:800;background:rgba(255,255,255,.92);color:#5A6478;padding:3px 7px;border-radius:7px;text-transform:uppercase;z-index:2}
.breed-body{padding:10px 11px 12px}
.breed-name{font-size:12.5px;font-weight:800;line-height:1.25}
.breed-sub{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
.timeline{position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:14px;width:2px;background:linear-gradient(180deg,#FFD3BC,#E9EDF5);border-radius:2px}
.tl-item{position:relative;margin-bottom:13px}
.tl-node{position:absolute;left:-30px;top:14px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #D8DFEA;display:grid;place-items:center}
.tl-node svg{width:11px;height:11px;fill:#fff;opacity:0}
.tl-item.ok .tl-node{background:var(--secondary);border-color:var(--secondary)}
.tl-item.ok .tl-node svg{opacity:1}
.tl-item.atrasada .tl-node{background:var(--danger);border-color:var(--danger)}
.tl-item.proxima .tl-node{border-color:var(--accent);background:var(--accent-soft)}
.vac-card{background:var(--card);border-radius:var(--radius-sm);padding:13px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.tl-item.ok .vac-card{border-color:#D3F0EB;background:linear-gradient(140deg,#fff,#F6FDFB)}
.tl-item.atrasada .vac-card{border-color:#FFD5E0;background:linear-gradient(140deg,#fff,#FFF7F9)}
.vac-head{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
.vac-name{font-size:13.5px;font-weight:800;line-height:1.3}
.vac-obs{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.vac-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.vac-date{font-size:11px;font-weight:800;color:#5A6478}
.vac-marca{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;background:var(--purple-soft);color:#6B31B8;padding:4px 8px;border-radius:7px;margin-top:6px}
.vac-marca svg{width:11px;height:11px;fill:currentColor}
.check-btn{width:30px;height:30px;border-radius:10px;flex-shrink:0;border:2px solid #D8DFEA;display:grid;place-items:center}
.check-btn svg{width:15px;height:15px;fill:#fff;opacity:0}
.check-btn.done{background:var(--secondary);border-color:var(--secondary)}
.check-btn.done svg{opacity:1}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:13px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:9px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.check-item.done{background:linear-gradient(140deg,#fff,#F6FDFB);border-color:#D3F0EB}
.check-box{width:23px;height:23px;border-radius:8px;flex-shrink:0;margin-top:1px;border:2px solid #D8DFEA;display:grid;place-items:center}
.check-box svg{width:13px;height:13px;fill:#fff;opacity:0}
.check-item.done .check-box{background:var(--secondary);border-color:var(--secondary)}
.check-item.done .check-box svg{opacity:1}
.check-txt{flex:1}
.check-txt h5{margin:0;font-size:13px;font-weight:800}
.check-item.done .check-txt h5{color:#7B879C;text-decoration:line-through}
.check-txt p{margin:4px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
.weight-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.weight-val{font-size:16px;font-weight:800;color:var(--primary-d);min-width:70px}
.weight-date{font-size:11.5px;color:var(--muted);font-weight:600;flex:1}
.weight-delta{font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px}
.delta-up{background:var(--secondary-soft);color:#12897A}
.delta-down{background:var(--danger-soft);color:#C42B50}
.delta-same{background:#F1F4F9;color:#66738A}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding:12px 4px 0;margin-bottom:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#FFA277,#FF7A45);min-height:6px}
.bar-lbl{font-size:9.5px;font-weight:800;color:var(--muted)}
.bar-val{font-size:10px;font-weight:800;color:var(--primary-d)}
.food-card{background:var(--card);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);margin-bottom:11px;border:1px solid rgba(234,238,246,.9)}
.food-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.food-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft);flex-shrink:0}
.food-head h4{margin:0;font-size:14px;font-weight:800}
.food-head p{margin:3px 0 0;font-size:11px;color:var(--muted);font-weight:600}
.food-list li{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5;color:#4C5768}
.food-list li:last-child{border-bottom:0}
.food-list li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:7px}
.food-brand{display:inline-block;font-size:10.5px;font-weight:800;color:var(--primary-d);background:var(--primary-soft);padding:4px 9px;border-radius:8px;margin:4px 5px 0 0}
.empty{text-align:center;padding:42px 24px;color:var(--muted)}
.empty .e-ic{font-size:42px;display:block;margin-bottom:12px;opacity:.75}
.empty h4{margin:0 0 6px;font-size:14.5px;font-weight:800;color:var(--txt)}
.empty p{margin:0;font-size:12.5px;line-height:1.6}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(19,25,38,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .26s ease;display:flex;align-items:flex-end}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-height:92vh;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,.28,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-backdrop.open .modal{transform:translateY(0)}
.modal-grab{padding:9px 0 4px;display:flex;justify-content:center;flex-shrink:0}
.modal-grab::after{content:"";width:38px;height:4.5px;border-radius:3px;background:#D5DCE8}
.modal-head{padding:6px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.modal-head h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.4px}
.modal-head p{margin:3px 0 0;font-size:12px;color:var(--muted);font-weight:600}
.modal-close{width:34px;height:34px;border-radius:12px;background:#EAEEF6;display:grid;place-items:center;flex-shrink:0}
.modal-close svg{width:16px;height:16px;fill:#66738A}
.modal-body{flex:1;overflow-y:auto;padding:0 20px 20px;-webkit-overflow-scrolling:touch}
.modal-foot{padding:13px 20px calc(20px + var(--safe-b));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;flex-shrink:0}
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:800;color:#5A6478;margin-bottom:7px}

.input,.select,.textarea{width:100%;padding:13px 14px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:600}

.textarea{min-height:80px;resize:vertical;font-family:inherit;line-height:1.5}
.select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237B879C'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 11px center;background-size:20px;padding-right:38px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.species-pick{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.species-opt{border:2px solid var(--line);border-radius:16px;padding:15px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;background:#fff}
.species-opt .sp-emoji{font-size:27px;line-height:1}
.species-opt .sp-name{font-size:12px;font-weight:800;color:#66738A}
.species-opt.active{border-color:var(--primary);background:var(--primary-soft)}

.avatar-pick{display:flex;gap:9px;flex-wrap:wrap}
.avatar-opt{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:#F1F4F9;border:2px solid transparent}
.avatar-opt.active{border-color:var(--primary);background:var(--primary-soft)}
.breed-hero{border-radius:22px;padding:22px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.breed-hero-svg{width:140px;height:140px;margin:0 auto 10px;position:relative;z-index:2;border-radius:26px;overflow:hidden;box-shadow:0 8px 24px rgba(27,36,52,.12)}
.breed-hero h2{margin:8px 0 3px;font-size:20px;font-weight:800;letter-spacing:-.5px;position:relative;z-index:2}
.breed-hero .bh-origem{font-size:11.5px;font-weight:700;color:#8A6A55;position:relative;z-index:2}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.spec{background:#fff;border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.spec-l{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.spec-v{font-size:13px;font-weight:800;margin-top:4px;color:var(--txt)}
.tag-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.tag{font-size:11px;font-weight:800;padding:6px 11px;border-radius:10px;background:var(--primary-soft);color:var(--primary-d)}
.blk{background:#fff;border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.blk h4{margin:0 0 10px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.blk h4 .b-ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;background:var(--primary-soft);flex-shrink:0}
.blk p{margin:0;font-size:12.5px;line-height:1.65;color:#4C5768}
.blk ul li{display:flex;gap:9px;padding:7px 0;font-size:12.5px;line-height:1.55;color:#4C5768}
.blk ul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:6px}
.blk.warn h4 .b-ic{background:var(--danger-soft)}
.blk.warn ul li::before{background:var(--danger)}
.blk.purple h4 .b-ic{background:var(--purple-soft);color:#6B31B8}
.blk.purple ul li::before{background:var(--purple)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 24px);transform:translate(-50%,26px);z-index:200;background:#1F2A3D;color:#fff;padding:12px 20px;border-radius:14px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.32,.72,.28,1);max-width:86vw;text-align:center;line-height:1.4}
.toast.show{opacity:1;transform:translate(-50%,0)}
.up{position:fixed;right:18px;bottom:calc(var(--tab-h) + var(--safe-b) + 82px);width:42px;height:42px;border-radius:14px;background:#fff;z-index:34;display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s ease;border:1px solid var(--line)}
.up.show{opacity:1;pointer-events:auto}
.up svg{width:17px;height:17px;fill:var(--primary)}
.anim{animation:fadeUp .38s cubic-bezier(.32,.72,.28,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}.d4{animation-delay:.16s}

.doenca-desc{font-size:12px;color:#4C5768;line-height:1.55;margin-bottom:9px}

.doenca-hero{border-radius:20px;padding:22px;text-align:center;margin-bottom:16px}
.doenca-hero-emoji{font-size:48px;margin-bottom:10px}
.doenca-hero h2{margin:0 0 6px;font-size:20px;font-weight:800}

.doenca-hero-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dh-badge{font-size:10.5px;font-weight:800;padding:6px 13px;border-radius:10px;text-transform:uppercase}
.doenca-fonte{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:8px 0;margin-bottom:8px}
.backup-status{background:linear-gradient(140deg,#F6FDFB,#E4F8F5);border:1.5px solid #C7E8E2;border-radius:16px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.backup-status .bs-ic{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#25C2B0,#4AD4C3);display:grid;place-items:center;font-size:20px;flex-shrink:0;color:#fff}
.backup-status .bs-titulo{font-size:12px;font-weight:800;color:#12897A;text-transform:uppercase}
.backup-status .bs-info{font-size:11.5px;color:#2C7A70;font-weight:700;margin-top:4px;line-height:1.4}
.backup-opt{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);margin-bottom:9px;cursor:pointer;text-align:left;width:100%}
.backup-opt .bo-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.backup-opt .bo-titulo{font-size:13.5px;font-weight:800}
.backup-opt .bo-desc{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.backup-opt .bo-arrow{color:#C7CFDD}
.backup-opt .bo-arrow svg{width:18px;height:18px;fill:currentColor}
.backup-hist{background:#fff;border-radius:var(--radius-sm);padding:12px 13px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);margin-bottom:9px;display:flex;align-items:center;gap:12px}
.backup-hist .bh-ic{width:38px;height:38px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.backup-hist .bh-data{font-size:12.5px;font-weight:800}
.backup-hist .bh-info{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px}
.backup-hist .bh-btn{padding:7px 11px;border-radius:10px;font-size:10.5px;font-weight:800;background:var(--primary-soft);color:var(--primary-d);flex-shrink:0}
.backup-hist .bh-btn.del{background:var(--danger-soft);color:var(--danger);padding:7px 9px}
.backup-hist .bh-btn.del svg{width:13px;height:13px;fill:currentColor}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:100%;background:linear-gradient(180deg,#F8F9FD 0%,#F4F6FB 100%)}
.chat-header{padding:14px 16px 12px;background:linear-gradient(135deg,#9B5DE5,#7B3FE5);color:#fff;position:relative;overflow:hidden;flex-shrink:0}
.chat-header::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10)}
.chat-header-top{display:flex;align-items:center;gap:11px;position:relative;z-index:2}
.chat-header .ia-avatar{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:22px;flex-shrink:0;backdrop-filter:blur(6px)}
.chat-header .ia-nome{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.chat-header .ia-status{font-size:11px;opacity:.88;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:5px}
.chat-header .ia-status .ia-dot-online{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 2px rgba(74,222,128,.3)}
.chat-header .ia-status .ia-dot-offline{width:7px;height:7px;border-radius:50%;background:#FFB020;box-shadow:0 0 0 2px rgba(255,176,32,.3)}
.chat-header-actions{display:flex;gap:6px;margin-left:auto}
.chat-header-actions button{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.chat-header-actions button svg{width:16px;height:16px;fill:#fff}
.chat-pet-context{padding:8px 14px 10px;background:rgba(255,255,255,.10);position:relative;z-index:2;margin:10px -16px -12px;display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.10)}
.chat-pet-context .pc-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);padding:4px 9px;border-radius:8px;letter-spacing:.2px}
.chat-body{flex:1;overflow-y:auto;padding:16px 14px;scroll-behavior:smooth;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.chat-body::-webkit-scrollbar{width:0}
.msg-row{display:flex;gap:9px;align-items:flex-end;animation:msgIn .28s cubic-bezier(.32,.72,.28,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:16px;font-weight:800}
.msg-row.ia .msg-avatar{background:linear-gradient(135deg,#9B5DE5,#7B3FE5);color:#fff;font-size:15px}
.msg-row.user .msg-avatar{background:linear-gradient(135deg,#FF8A5B,#F0521B);color:#fff}
.msg-bubble{max-width:78%;padding:11px 14px;border-radius:18px;font-size:13.5px;line-height:1.55;font-weight:500;box-shadow:0 2px 10px rgba(27,36,52,.05);word-wrap:break-word}
.msg-row.ia .msg-bubble{background:#fff;border:1px solid rgba(234,238,246,.9);border-bottom-left-radius:6px;color:#1B2434}
.msg-row.user .msg-bubble{background:linear-gradient(135deg,#FF8A5B,#F0521B);color:#fff;border-bottom-right-radius:6px}
.msg-bubble strong{font-weight:800}
.msg-bubble em{font-style:italic;color:#7B3FE5}
.msg-time{font-size:9.5px;color:var(--muted);font-weight:700;margin-top:5px;text-align:right;opacity:.7}
.msg-row.user .msg-time{color:rgba(255,255,255,.65)}
.msg-tag{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:3px 7px;border-radius:6px;margin-bottom:6px}
.msg-tag.info{background:#EAF0FF;color:#3157C9}
.msg-tag.alerta{background:#FFE9EF;color:#C42B50}
.msg-tag.dica{background:#E4F8F5;color:#12897A}
.msg-tag.emergencia{background:linear-gradient(135deg,#EF476F,#C42B50);color:#fff}
.typing{display:flex;gap:4px;align-items:center;padding:13px 16px}
.typing span{width:7px;height:7px;border-radius:50%;background:#9B5DE5;opacity:.4;animation:typingAnim 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typingAnim{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chat-suggestions{padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chat-suggestions::-webkit-scrollbar{display:none}
.sug-row{display:flex;gap:7px;padding-bottom:2px}
.sug-chip{flex-shrink:0;padding:9px 13px;border-radius:12px;background:#fff;border:1.5px solid #E9E0F8;color:#6B31B8;font-size:11.5px;font-weight:800;transition:all .15s ease;white-space:nowrap}
.sug-chip:active{transform:scale(.96);background:#F3EAFE}
.chat-input-wrap{padding:10px 14px calc(10px + var(--safe-b));background:#fff;border-top:1px solid var(--line);flex-shrink:0}
.chat-input-row{display:flex;gap:8px;align-items:flex-end;background:#F1F4F9;border-radius:22px;padding:6px 6px 6px 16px;transition:background .2s ease}
.chat-input-row:focus-within{background:#EDE9FB}
.chat-input{flex:1;background:none;border:0;padding:9px 0;font-size:13.5px;font-weight:600;max-height:100px;resize:none;line-height:1.4;font-family:inherit}
.chat-input::placeholder{color:#A9B3C4;font-weight:500}
.chat-send{width:40px;height:40px;border-radius:15px;background:linear-gradient(135deg,#9B5DE5,#7B3FE5);display:grid;place-items:center;transition:transform .15s ease,opacity .2s ease;flex-shrink:0}
.chat-send:active{transform:scale(.9)}
.chat-send:disabled{opacity:.4}
.chat-send svg{width:18px;height:18px;fill:#fff}
.chat-welcome{padding:24px 18px;text-align:center}
.chat-welcome .cw-hero{width:80px;height:80px;border-radius:26px;background:linear-gradient(135deg,#9B5DE5,#7B3FE5);display:grid;place-items:center;margin:0 auto 14px;font-size:40px;box-shadow:0 12px 30px rgba(155,93,229,.28)}
.chat-welcome h2{margin:0 0 8px;font-size:19px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,#9B5DE5,#7B3FE5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.chat-welcome p{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.6;font-weight:600}
.chat-welcome .cw-cat{margin-top:20px;display:flex;flex-direction:column;gap:8px;text-align:left}
.chat-welcome .cw-cat-btn{display:flex;align-items:center;gap:11px;padding:12px 13px;background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.chat-welcome .cw-cat-btn:active{transform:scale(.98)}
.chat-welcome .cw-cat-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.chat-welcome .cw-cat-body{flex:1;text-align:left}
.chat-welcome .cw-cat-titulo{font-size:13px;font-weight:800;color:#1B2434}
.chat-welcome .cw-cat-desc{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.chat-welcome .cw-cat-arrow{width:16px;height:16px;fill:#C7CFDD}
.chat-config-warn{margin:14px;padding:12px 14px;background:linear-gradient(140deg,#FFF6F0,#FFF0E8);border:1.5px solid #FFE3D4;border-radius:14px;font-size:11.5px;line-height:1.55;color:#8A6A55;font-weight:600;display:flex;gap:9px;align-items:flex-start}
.chat-config-warn.ok{background:linear-gradient(140deg,#F6FDFB,#E4F8F5);border-color:#C7E8E2;color:#2C7A70}
.chat-config-warn .cw-ic{font-size:16px;flex-shrink:0;line-height:1.2}
.api-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.api-badge.ok{background:#E4F8F5;color:#12897A}
.api-badge.warn{background:#FFF6E2;color:#B47800}

@media(max-width:340px){
  .quick span{font-size:8.5px}
  .tab span{font-size:8px}
  .breed-grid{gap:8px}
  .subnav-btn{font-size:10.5px;padding:8px 11px}
  .msg-bubble{max-width:82%}
}
</style>

<body>

<div id="app">
  <header class="app-header" id="appHeader">

        </div>
        <div>
          <div class="hdr-title">PetVida</div>
          <div class="hdr-sub" id="hdrSub">Cuide bem do seu melhor amigo</div>
        </div>
      </div>
      <div class="hdr-actions">
        <button class="icon-btn" onclick="abrirModalBackup()" aria-label="Backup" id="btnBackup">
          <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7a2 2 0 002 2h14a2 2 0 002-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/></svg>

          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm1.8-7.1l-.9.9c-.7.7-1 1.2-1 2.2h-2v-.5c0-1 .4-1.9 1.1-2.6l1.2-1.3c.4-.3.6-.8.6-1.3a2 2 0 10-4 0H8a4 4 0 118 0c0 .8-.3 1.5-.9 2.1z"/></svg>

      <div class="stat"><div class="stat-n" id="stPend">0</div><div class="stat-l">PENDENTES</div></div>

  <div class="swiper" id="swiper">
    <section class="page active" id="page-0"><div id="homeContent"></div></section>

        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 10-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>

      <div class="breed-grid" id="breedGrid"></div>
    </section>
    <section class="page" id="page-3">

      <div id="vacinasPetPicker"></div>
      <div id="vacinasContent"></div>
    </section>
    <section class="page" id="page-4">
      <div class="sec-head"><div class="sec-title"><span class="dot"></span>Saúde & Cuidados</div></div>
      <div id="saudeSubnav"></div>
      <div id="saudeContent"></div>
    </section>
    <section class="page" id="page-5">
      <div class="sec-head"><div class="sec-title"><span class="dot"></span>Alimentação</div></div>
      <div id="racoesContent"></div>

    <section class="page" id="page-6">

          <div class="chat-header-top">

              <div class="ia-nome">Dr. Pet IA</div>

              <button onclick="abrirModalConfigIA()" aria-label="Configurações">

      <span>Início</span>

    <button class="tab" data-i="1" onclick="goTo(1)">

<script>
/* ============================================================
   🔑 CONFIGURAÇÃO PADRÃO DA IA
============================================================ */
/* API Key pré-configurada do usuário. 
   ⚠️ AVISO: Esta chave foi compartilhada publicamente. 
   Recomenda-se revogá-la e gerar uma nova no painel do provedor. */
const DEFAULT_IA_CONFIG = {
  provider: 'gemini',
  apiKey: 'AQ.Ab8RN6KHgKVv4nH5XrXOTFrBYs9BWuBeXAwym17-W8yCsZ4h0g',
  model: 'gemini-1.5-flash'
};

const DB_KEY = 'petvida_v9';
const BACKUP_KEY = 'petvida_backups';
const IA_CONFIG_KEY = 'petvida_ia_config_v9';
const CHAT_HISTORY_KEY = 'petvida_chat_history';
const MAX_AUTO_BACKUPS = 5;

let state = {
  pets: [], currentPage: 0, especieRaca: 'cao', buscaRaca: '', porteFiltro: 'todos',
  petSelecionado: null, saudeSub: 'visao', saudeBusca: '', guiaSub: 'alimentos',
  marcaVacinaSel: '', doencaEspecie: 'cao', doencaRiscoFiltro: 'todos',
  ultimaAtualizacao: null,
  chat: [], chatTyping: false
};

let iaConfig = Object.assign({}, DEFAULT_IA_CONFIG);

/* ============================================================
   PERSISTÊNCIA
============================================================ */
function saveDB(){
  try{
    state.ultimaAtualizacao = new Date().toISOString();
    localStorage.setItem(DB_KEY, JSON.stringify({pets: state.pets, ultimaAtualizacao: state.ultimaAtualizacao}));
    atualizarBadgeBackup();
  }catch(e){ console.error('Erro ao salvar:', e); }
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d.pets)) state.pets = d.pets;
      if(d.ultimaAtualizacao) state.ultimaAtualizacao = d.ultimaAtualizacao;
    }
  }catch(e){ state.pets = []; }
  state.pets.forEach(p=>{
    if(!p.historico) p.historico = {consultas:[],exames:[],medicamentos:[],cirurgias:[],alergias:[]};
    if(!p.antipulgas) p.antipulgas = [];
    if(!p.cio) p.cio = [];
    if(!p.diario) p.diario = [];
    if(!p.tutores) p.tutores = [];
    if(!p.vacinas) p.vacinas = {};
  });
}
function saveIAConfig(){ try{ localStorage.setItem(IA_CONFIG_KEY, JSON.stringify(iaConfig)); }catch(e){} }
function loadIAConfig(){
  try{
    const raw = localStorage.getItem(IA_CONFIG_KEY);
    if(raw){
      const d = JSON.parse(raw);
      /* Se o usuário já salvou uma config, ela tem prioridade;
         caso contrário usa o DEFAULT_IA_CONFIG com a chave pré-configurada */
      iaConfig = Object.assign({}, DEFAULT_IA_CONFIG, d);
    }
    /* Se não havia nada salvo, salva o padrão automaticamente */
    else {
      saveIAConfig();
    }
  }catch(e){ iaConfig = Object.assign({}, DEFAULT_IA_CONFIG); }
}
function saveChatHistory(){
  try{
    const curto = state.chat.slice(-40);
    localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(curto));
  }catch(e){}
}
function loadChatHistory(){
  try{
    const raw = localStorage.getItem(CHAT_HISTORY_KEY);
    if(raw){ const d = JSON.parse(raw); if(Array.isArray(d)) state.chat = d; }
  }catch(e){}
}

/* ============================================================
   BACKUP
============================================================ */
function getBackups(){
  try{
    const raw = localStorage.getItem(BACKUP_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function setBackups(arr){ try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(arr)); }catch(e){} }
function fazerBackupAutomatico(motivo){
  const backups = getBackups();
  const backup = {
    id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    data: new Date().toISOString(),
    motivo: motivo || 'Automático',
    qtdPets: state.pets.length,
    tamanho: JSON.stringify(state.pets).length,
    dados: JSON.parse(JSON.stringify(state.pets))
  };
  backups.unshift(backup);
  while(backups.length > MAX_AUTO_BACKUPS) backups.pop();
  setBackups(backups);
  return backup;
}
function atualizarBadgeBackup(){
  const badge = $('#badgeBackup');
  if(!badge) return;
  const ultima = state.ultimaAtualizacao ? new Date(state.ultimaAtualizacao) : null;
  if(!ultima){ badge.style.display = 'block'; return; }
  const horas = (Date.now() - ultima.getTime()) / (1000 * 60 * 60);
  badge.style.display = horas > 24 ? 'block' : 'none';
}
function tempoRelativo(iso){
  if(!iso) return 'Nunca';
  const d = new Date(iso);
  const diff = Date.now() - d.getTime();
  const seg = Math.floor(diff/1000);
  const min = Math.floor(seg/60);
  const horas = Math.floor(min/60);
  const dias = Math.floor(horas/24);
  if(seg < 60) return 'Agora mesmo';
  if(min < 60) return min + (min === 1 ? ' minuto atrás' : ' minutos atrás');
  if(horas < 24) return horas + (horas === 1 ? ' hora atrás' : ' horas atrás');
  if(dias === 1) return 'Ontem';
  if(dias < 7) return dias + ' dias atrás';
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short', year:'numeric'});
}
function formatarTamanho(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}
function abrirModalBackup(){
  const backups = getBackups();
  const totalPets = state.pets.length;
  const tamanho = JSON.stringify(state.pets).length;
  const ultima = state.ultimaAtualizacao;
  let html = `
    <div class="backup-status">
      <div class="bs-ic">💾</div>
      <div class="bs-body">
        <div class="bs-titulo">Dados salvos localmente</div>
        <div class="bs-info">${totalPets} pet${totalPets !== 1 ? 's' : ''} · ${formatarTamanho(tamanho)}<br>Última atualização: ${tempoRelativo(ultima)}</div>
      </div>
    </div>
    <div class="sec-head" style="margin-top:4px"><div class="sec-title"><span class="dot"></span>Ações</div></div>
    <button class="backup-opt" onclick="salvarAgora()">
      <div class="bo-ic" style="background:linear-gradient(135deg,#25C2B0,#4AD4C3);color:#fff">💾</div>
      <div class="bo-body"><div class="bo-titulo">Salvar agora</div><div class="bo-desc">Força o salvamento dos dados no dispositivo</div></div>
      <div class="bo-arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></div>
    </button>
    <button class="backup-opt" onclick="exportarBackup()">
      <div class="bo-ic" style="background:linear-gradient(135deg,#4A7DFF,#6B9BFF);color:#fff">📥</div>
      <div class="bo-body"><div class="bo-titulo">Exportar backup</div><div class="bo-desc">Baixa um arquivo JSON com todos os dados</div></div>
      <div class="bo-arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></div>
    </button>
    <button class="backup-opt" onclick="abrirImport()">
      <div class="bo-ic" style="background:linear-gradient(135deg,#9B5DE5,#B585F0);color:#fff">📤</div>
      <div class="bo-body"><div class="bo-titulo">Importar backup</div><div class="bo-desc">Restaura dados de um arquivo JSON salvo anteriormente</div></div>
      <div class="bo-arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></div>
    </button>
    <button class="backup-opt" onclick="compartilharBackup()">
      <div class="bo-ic" style="background:linear-gradient(135deg,#FFB020,#FFCB5C);color:#fff">📤</div>
      <div class="bo-body"><div class="bo-titulo">Compartilhar backup</div><div class="bo-desc">Enviar por WhatsApp, email ou salvar na nuvem</div></div>
      <div class="bo-arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></div>
    </button>`;
  if(backups.length > 0){
    html += `<div class="sec-head" style="margin-top:22px"><div class="sec-title"><span class="dot"></span>Backups automáticos</div>
      <span style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase">${backups.length} salvos</span></div>`;
    html += backups.map(b=>`
      <div class="backup-hist">
        <div class="bh-ic">🕒</div>
        <div class="bh-body">
          <div class="bh-data">${new Date(b.data).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</div>
          <div class="bh-info">${b.qtdPets} pet${b.qtdPets !== 1 ? 's' : ''} · ${formatarTamanho(b.tamanho)} · ${b.motivo}</div>
        </div>
        <button class="bh-btn" onclick="restaurarBackup('${b.id}')">Restaurar</button>
        <button class="bh-btn del" onclick="excluirBackup('${b.id}')">
          <svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
      </div>`).join('');
  }
  html += `<div class="blk warn" style="margin-top:16px">
    <h4><span class="b-ic">💡</span>Como funciona</h4>
    <p>Seus dados ficam salvos no próprio dispositivo (localStorage). O backup automático mantém as últimas ${MAX_AUTO_BACKUPS} versões. Para maior segurança, exporte um arquivo JSON periodicamente e guarde no Google Drive, e-mail ou na nuvem.</p>
  </div>`;
  openModal(headPadrao('Backup e Restauração', 'Proteja os dados do seu pet'), html,
    `<button class="btn btn-primary" onclick="closeModal()">Fechar</button>`);
}
function salvarAgora(){ saveDB(); toast('Dados salvos! ✅'); setTimeout(()=> abrirModalBackup(), 400); }
function exportarBackup(){
  try{
    const dados = {app:'PetVida', versao:'v9', exportadoEm:new Date().toISOString(), qtdPets:state.pets.length, pets:state.pets};
    const json = JSON.stringify(dados, null, 2);
    const blob = new Blob([json], {type: 'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `petvida-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    toast('Backup exportado! 📥');
  }catch(e){ toast('Erro ao exportar'); }
}
function abrirImport(){ $('#inputImport').click(); }
function processarImport(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 5 * 1024 * 1024){ toast('Arquivo muito grande (máx 5MB)'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const dados = JSON.parse(e.target.result);
      if(!dados.pets || !Array.isArray(dados.pets)){ toast('Arquivo inválido'); input.value = ''; return; }
      previewImport(dados, file.name);
    }catch(err){ toast('Erro ao ler arquivo'); }
    input.value = '';
  };
  reader.readAsText(file);
}
function previewImport(dados, nomeArq){
  const qtdPets = dados.pets.length;
  const dataExp = dados.exportadoEm ? new Date(dados.exportadoEm) : null;
  const petsAtuais = state.pets.length;
  fazerBackupAutomatico('Pré-importação');
  let lista = '';
  if(qtdPets > 0){
    lista = `<ul style="margin-top:10px">${dados.pets.slice(0,5).map(p=>`<li>${p.emoji || '🐾'} <strong>${esc(p.nome)}</strong> · ${esc(p.raca||'SRD')}</li>`).join('')}${qtdPets > 5 ? `<li>... e mais ${qtdPets-5}</li>` : ''}</ul>`;
  }
  openModal(headPadrao('Confirmar importação', 'Revise antes de restaurar'),
    `<div class="backup-status">
      <div class="bs-ic">📦</div>
      <div class="bs-body">
        <div class="bs-titulo">Backup encontrado</div>
        <div class="bs-info">${esc(nomeArq)}<br>${qtdPets} pet${qtdPets !== 1 ? 's' : ''} · ${dataExp ? dataExp.toLocaleString('pt-BR') : '—'}</div>
      </div>
    </div>
    <div class="blk"><h4><span class="b-ic">🐾</span>Pets no backup</h4>${lista || '<p>Nenhum pet.</p>'}</div>
    <div class="blk warn"><h4><span class="b-ic">⚠️</span>Atenção</h4><p>Os <strong>${petsAtuais} pet${petsAtuais !== 1 ? 's' : ''}</strong> atuais serão substituídos pelos <strong>${qtdPets} pet${qtdPets !== 1 ? 's' : ''}</strong> do backup.</p></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="confirmarImport(${JSON.stringify(JSON.stringify(dados))})">Restaurar backup</button>`);
}
function confirmarImport(dadosJson){
  try{
    const dados = JSON.parse(dadosJson);
    state.pets = dados.pets;
    state.pets.forEach(p=>{
      if(!p.historico) p.historico = {consultas:[],exames:[],medicamentos:[],cirurgias:[],alergias:[]};
      if(!p.antipulgas) p.antipulgas = [];
      if(!p.diario) p.diario = [];
      if(!p.tutores) p.tutores = [];
      if(!p.vacinas) p.vacinas = {};
      if(!p.pesos) p.pesos = [];
      if(!p.cuidados) p.cuidados = [];
    });
    state.petSelecionado = state.pets[0] ? state.pets[0].id : null;
    saveDB(); closeModal(); toast('Backup restaurado! 🎉'); goTo(0); atualizarHeader();
  }catch(e){ toast('Erro ao restaurar'); }
}
function compartilharBackup(){
  try{
    const dados = {app:'PetVida', versao:'v9', exportadoEm:new Date().toISOString(), qtdPets:state.pets.length, pets:state.pets};
    const json = JSON.stringify(dados);
    const blob = new Blob([json], {type: 'application/json;charset=utf-8'});
    const file = new File([blob], `petvida-backup-${new Date().toISOString().slice(0,10)}.json`, {type: 'application/json'});
    if(navigator.share && navigator.canShare && navigator.canShare({files: [file]})){
      navigator.share({title:'Backup PetVida', text:`Backup dos dados de ${state.pets.length} pet(s)`, files:[file]}).catch(()=>{});
    } else { exportarBackup(); toast('Compartilhamento não disponível — arquivo baixado'); }
  }catch(e){ toast('Erro ao compartilhar'); }
}
function restaurarBackup(id){
  const backups = getBackups();
  const b = backups.find(x=>x.id === id);
  if(!b){ toast('Backup não encontrado'); return; }
  openModal(headPadrao('Restaurar backup', 'Confirmar restauração'),
    `<div class="backup-status">
      <div class="bs-ic">🕒</div>
      <div class="bs-body">
        <div class="bs-titulo">Backup selecionado</div>
        <div class="bs-info">${new Date(b.data).toLocaleString('pt-BR')}<br>${b.qtdPets} pet${b.qtdPets !== 1 ? 's' : ''} · ${formatarTamanho(b.tamanho)} · ${b.motivo}</div>
      </div>
    </div>
    <div class="blk warn"><h4><span class="b-ic">⚠️</span>Atenção</h4><p>Os dados atuais serão substituídos.</p></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="confirmarRestauracaoBackup('${id}')">Restaurar</button>`);
}
function confirmarRestauracaoBackup(id){
  const backups = getBackups();
  const b = backups.find(x=>x.id === id);
  if(!b){ toast('Backup não encontrado'); return; }
  fazerBackupAutomatico('Pré-restauração');
  state.pets = JSON.parse(JSON.stringify(b.dados));
  state.pets.forEach(p=>{
    if(!p.historico) p.historico = {consultas:[],exames:[],medicamentos:[],cirurgias:[],alergias:[]};
    if(!p.antipulgas) p.antipulgas = [];
    if(!p.diario) p.diario = [];
    if(!p.tutores) p.tutores = [];
    if(!p.vacinas) p.vacinas = {};
    if(!p.pesos) p.pesos = [];
    if(!p.cuidados) p.cuidados = [];
  });
  state.petSelecionado = state.pets[0] ? state.pets[0].id : null;
  saveDB(); closeModal(); toast('Backup restaurado! 🎉'); goTo(0); atualizarHeader();
}
function excluirBackup(id){
  const backups = getBackups();
  setBackups(backups.filter(x=>x.id !== id));
  toast('Backup excluído');
  abrirModalBackup();
}

/* ============================================================
   UTILITÁRIOS
============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(str){
  return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtData(iso){
  if(!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function hojeISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addWeeks(date, weeks){ const d = new Date(date.getTime()); d.setDate(d.getDate() + weeks*7); return d; }
function diffDias(a, b){ return Math.round((a - b) / 86400000); }
function calcIdade(nascimento){
  if(!nascimento) return '—';
  const nasc = new Date(nascimento + 'T12:00:00');
  if(isNaN(nasc)) return '—';
  const hoje = new Date();
  let meses = (hoje.getFullYear()-nasc.getFullYear())*12 + (hoje.getMonth()-nasc.getMonth());
  if(hoje.getDate() < nasc.getDate()) meses--;
  if(meses < 0) meses = 0;
  const anos = Math.floor(meses/12);
  const m = meses % 12;
  if(meses < 1){ const dias = Math.max(0, diffDias(hoje, nasc)); return dias + (dias === 1 ? ' dia' : ' dias'); }
  if(anos === 0) return m + (m===1?' mês':' meses');
  if(m === 0) return anos + (anos===1?' ano':' anos');
  return anos + 'a ' + m + 'm';
}
function idadeHumana(pet){
  if(!pet.nascimento) return '—';
  const nasc = new Date(pet.nascimento + 'T12:00:00');
  const hoje = new Date();
  let meses = (hoje.getFullYear()-nasc.getFullYear())*12 + (hoje.getMonth()-nasc.getMonth());
  if(hoje.getDate() < nasc.getDate()) meses--;
  if(meses < 0) meses = 0;
  const anos = meses / 12;
  let humano = 0;
  if(pet.especie === 'gato'){
    if(anos <= 1) humano = anos * 15;
    else if(anos <= 2) humano = 15 + (anos - 1) * 9;
    else humano = 24 + (anos - 2) * 4;
  } else {
    const p = parseFloat(String(pet.peso||'').replace(',','.')) || 0;
    let mult = 5;
    if(p < 10) mult = 4;
    else if(p < 25) mult = 5;
    else if(p < 45) mult = 6;
    else mult = 7;
    if(anos <= 1) humano = anos * 15;
    else if(anos <= 2) humano = 15 + (anos - 1) * 9;
    else humano = 24 + (anos - 2) * mult;
  }
  return Math.round(humano) + ' anos';
}
function faixaEtaria(nascimento){
  const nasc = new Date(nascimento + 'T12:00:00');
  const meses = (new Date().getFullYear()-nasc.getFullYear())*12 + (new Date().getMonth()-nasc.getMonth());
  if(meses < 2) return 'filhote';
  if(meses < 12) return 'junior';
  if(meses < 84) return 'adulto';
  return 'senior';
}
function idadeDetalhada(pet){
  if(!pet.nascimento) return null;
  const nasc = new Date(pet.nascimento + 'T12:00:00');
  const hoje = new Date();
  let meses = (hoje.getFullYear()-nasc.getFullYear())*12 + (hoje.getMonth()-nasc.getMonth());
  if(hoje.getDate() < nasc.getDate()) meses--;
  if(meses < 0) meses = 0;
  const anos = Math.floor(meses/12);
  const mesesRestantes = meses % 12;
  let animalTxt = '';
  if(anos === 0 && mesesRestantes === 0){
    const dias = Math.max(0, diffDias(hoje, nasc));
    animalTxt = dias + (dias === 1 ? ' dia' : ' dias');
  } else if(anos === 0){
    animalTxt = mesesRestantes + (mesesRestantes === 1 ? ' mês' : ' meses');
  } else if(mesesRestantes === 0){
    animalTxt = anos + (anos === 1 ? ' ano' : ' anos');
  } else {
    animalTxt = anos + (anos === 1 ? ' ano' : ' anos') + ' e ' + mesesRestantes + (mesesRestantes === 1 ? ' mês' : ' meses');
  }
  return { meses, anos, mesesRestantes, animalTxt, humano: idadeHumana(pet), faixa: faixaEtaria(pet.nascimento) };
}
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=> t.classList.remove('show'), 2400);
}
function gerarIdPet(pet){
  const base = (pet.nome||'PET').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,4).padEnd(4,'X');
  const hash = (pet.id||'0000').slice(-4).toUpperCase();
  return 'PET-' + base + '-' + hash;
}
function padraoQr(pet, size){
  const s = size || 74;
  const seed = (pet.id||'x').split('').reduce((a,c)=>a+c.charCodeAt(0), 0);
  let cells = '';
  const n = 11;
  const c = s / n;
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const pseudo = Math.abs(Math.sin(seed + x*7 + y*13) * 10000) % 1;
      const isFinder = (x<3&&y<3)||(x>=n-3&&y<3)||(x<3&&y>=n-3);
      let fill = false;
      if(isFinder){ const fx = x<3?x:(x-(n-3)); const fy = y<3?y:(y-(n-3)); fill = !(fx===1 && fy===1); }
      else { fill = pseudo > 0.52; }
      if(fill) cells += `<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#1B2434"/>`;
    }
  }
  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg" style="background:#fff;border-radius:4px">${cells}</svg>`;
}

function racoesRecomendadas(pet){
  const faixa = faixaEtaria(pet.nascimento);

}
function porteDoPet(pet){
  if(pet.peso){
    const p = parseFloat(String(pet.peso).replace(',','.'));
    if(pet.especie === 'cao'){
      if(p < 10) return 'pequeno';
      if(p < 25) return 'medio';
      return 'grande';
    }
  }
  return pet.especie === 'cao' ? 'medio' : 'pequeno';
}

/* ============================================================
   IA REAL — GEMINI / OPENAI / ANTHROPIC
============================================================ */
async function chamarIAReal(pergunta, petCtx){
  const cfg = iaConfig;
  if(!cfg.apiKey || cfg.provider === 'local') return null;

  const sysPrompt = `Você é o Dr. Pet IA, um assistente veterinário especializado em cães e gatos.
Regras:
- Responda SEMPRE em português do Brasil
- Seja empático, claro e direto
- Use formatação simples com **negrito** e listas quando útil
- SEMPRE inclua um aviso breve de que não substitui consulta veterinária
- Se for emergência, oriente a procurar atendimento imediatamente
- Não prescreva medicamentos específicos (doses, marcas)
- Seja conciso: máximo 250 palavras
${petCtx ? `\nContexto do pet do tutor:\n- Nome: ${petCtx.nome}\n- Espécie: ${petCtx.especie}\n- Raça: ${petCtx.raca || 'SRD'}\n- Idade: ${petCtx.idade}\n- Peso: ${petCtx.peso || 'não informado'}` : ''}`;

  try{
    let url = '';
    let headers = {'Content-Type':'application/json'};
    let body = {};

    if(cfg.provider === 'openai'){
      url = 'https://api.openai.com/v1/chat/completions';
      headers['Authorization'] = `Bearer ${cfg.apiKey}`;
      body = {
        model: cfg.model || 'gpt-4o-mini',
        messages: [
          {role:'system', content: sysPrompt},
          {role:'user', content: pergunta}
        ],
        max_tokens: 700,
        temperature: 0.7
      };
    } else if(cfg.provider === 'gemini'){
      const model = cfg.model || 'gemini-1.5-flash';
      url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cfg.apiKey)}`;
      body = {
        contents: [{parts: [{text: sysPrompt + '\n\nPergunta: ' + pergunta}]}],
        generationConfig: {maxOutputTokens: 700, temperature: 0.7}
      };
    } else if(cfg.provider === 'anthropic'){
      url = 'https://api.anthropic.com/v1/messages';
      headers['x-api-key'] = cfg.apiKey;
      headers['anthropic-version'] = '2023-06-01';
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
      body = {
        model: cfg.model || 'claude-3-5-sonnet-20241022',
        max_tokens: 700,
        system: sysPrompt,
        messages: [{role:'user', content: pergunta}]
      };
    }

    const res = await fetch(url, {method:'POST', headers, body: JSON.stringify(body)});
    if(!res.ok){
      const errTxt = await res.text();
      console.warn('IA erro HTTP:', res.status, errTxt);
      return null;
    }
    const data = await res.json();

    let texto = '';
    if(cfg.provider === 'openai'){
      texto = data.choices?.[0]?.message?.content || '';
    } else if(cfg.provider === 'gemini'){
      texto = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    } else if(cfg.provider === 'anthropic'){
      texto = data.content?.[0]?.text || '';
    }
    if(!texto) return null;
    return {texto, tipo:'info', real:true};
  }catch(e){
    console.warn('IA fetch erro:', e);
    return null;
  }
}

/* Motor local */
function processarPerguntaLocal(pergunta, petCtx){
  const t = (pergunta || '').toLowerCase().trim();
  if(!t) return null;
  const tokens = t.split(/\s+/);
  let melhor = null, melhorScore = 0;

  IA_KB.forEach(item=>{
    let score = 0;
    item.palavras.forEach(p=>{
      const pl = p.toLowerCase();
      if(t.includes(pl)) score += (pl.split(' ').length > 1 ? 2 : 1) * (item.peso || 1);
      else {
        tokens.forEach(tk=>{
          if(tk.length > 3 && pl.includes(tk)) score += 0.5 * (item.peso || 1);
        });
      }
    });
    if(score > melhorScore){ melhorScore = score; melhor = item; }
  });

  if(!melhor || melhorScore < 1) return gerarRespostaGenerica(pergunta, petCtx);
  return {texto: melhor.resposta, tipo: melhor.tipo};
}
function gerarRespostaGenerica(pergunta, petCtx){
  const q = pergunta.toLowerCase();
  let ctx = petCtx ? `\n\n💡 **Considerando ${petCtx.nome}** (${petCtx.raca || 'SRD'}, ${petCtx.idade}):\n` : '';
  if(/feliz|comportad|educad/.test(q)) return {texto:'😊 Que bom! Continue o reforço positivo.' + ctx};
  if(/brinca|jogo/.test(q)) return {texto:'🎾 **Ideias:**\n• Cabo de guerra\n• Buscar bolinha\n• Esconder petiscos\n• Brinquedos interativos\n\n15-30 min 2x ao dia!' + ctx};
  if(/obrigad|valeu/.test(q)) return {texto:'🐾 Fico feliz em ajudar! Estou aqui sempre que precisar. 💜'};

  const sug = ['vacinação','alimentação','comportamento','emergências','cuidados com filhotes','saúde preventiva'];
  return {
    texto: `🤔 Não tenho uma resposta específica pronta, mas posso ajudar com:\n\n• 💉 Vacinas e protocolos\n• 🍖 Alimentação adequada\n• 🐕 Comportamento e adestramento\n• 🚑 Emergências\n• 🐶 Cuidados com filhotes\n• 🩺 Saúde preventiva\n\nTente perguntar de forma mais específica:\n*"Quais vacinas meu cão precisa?"*\n*"Meu gato está vomitando, o que fazer?"*\n*"Com que frequência dar banho?"*` + ctx
  };
}

          ${m.tipo ? `<span class="msg-tag ${m.tipo}">${rotuloTipo(m.tipo)}</span><br>` : ''}
          ${formatarMensagem(m.texto)}
        </div>
        <div class="msg-time">${m.hora || ''}${m.real ? ' · IA' : ''}</div>

    </div>
  `).join('') + (state.chatTyping ? `

      <div class="msg-bubble typing"><span></span><span></span><span></span></div>

function rotuloTipo(t){
  const m = {info:'Informativo', alerta:'Atenção', dica:'Dica', emergencia:'Emergência'};
  return m[t] || 'Info';
}
function formatarMensagem(texto){
  let t = esc(texto);
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\n/g, '<br>');
  t = t.replace(/(\d+)\.\s/g, '<br>$1. ');
  t = t.replace(/[•·]\s/g, '<br>• ');
  t = t.replace(/^(<br>)+/, '');
  return t;
}
function autoResizeChat(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';

async function enviarMensagem(){
  const inp = $('#chatInput');
  const txt = (inp.value || '').trim();
  if(!txt || state.chatTyping) return;
  inp.value = '';
  autoResizeChat(inp);

  state.chat.push({role:'user', texto: txt, hora: agoraHHMM()});
  state.chatTyping = true;
  renderChat();
  saveChatHistory();

  const pet = state.pets.find(p => p.id === state.petSelecionado) || state.pets[0];
  const petCtx = pet ? {
    nome: pet.nome,
    especie: pet.especie === 'gato' ? 'Gato' : 'Cão',
    raca: pet.raca,
    idade: calcIdade(pet.nascimento),
    peso: pet.peso
  } : null;

  try{
    let resposta = null;
    if(iaConfig.provider !== 'local' && iaConfig.apiKey){
      resposta = await chamarIAReal(txt, petCtx);
    }
    if(!resposta){
      await new Promise(r => setTimeout(r, 350 + Math.random() * 400));
      resposta = processarPerguntaLocal(txt, petCtx);
      /* Se a IA real falhou mas estávamos tentando usar, avisa uma vez */
      if(iaConfig.provider !== 'local' && iaConfig.apiKey && !state._iaAvisoFalha){
        state._iaAvisoFalha = true;
        resposta.texto = `⚠️ *Não consegui conectar com a IA ${iaConfig.provider}. Usando base local.*\n\n---\n\n` + resposta.texto;
      }
    }
    state.chat.push({
      role: 'ia',
      texto: resposta.texto,
      tipo: resposta.tipo,
      hora: agoraHHMM(),
      real: resposta.real || false
    });
  }catch(e){
    console.error(e);
    state.chat.push({
      role: 'ia',
      texto: '❌ Ops! Tive um problema ao processar sua pergunta. Tente novamente.',
      tipo: 'alerta',
      hora: agoraHHMM()
    });
  } finally {
    state.chatTyping = false;
    renderChat();
    saveChatHistory();
  }
}

(function swipeInit(){
  const sw = $('#swiper');
  let x0=0, y0=0, ativo=false;
  sw.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1) return;
    if(e.target.closest('.chat-body') || e.target.closest('.chat-suggestions') || e.target.closest('.chat-input')) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; ativo = true;

/* ============================================================
   STATUS VACINAL
============================================================ */
function normalizarVacina(v){
  if(!v) return null;
  if(typeof v === 'string') return {data: v, marca:'', lote:'', vet:'', clinica:'', obs:''};
  return v;
}
function statusVacina(pet, v){
  const raw = pet.vacinas && pet.vacinas[v.id];
  const aplicada = normalizarVacina(raw);
  const nasc = new Date(pet.nascimento + 'T12:00:00');
  const due = addWeeks(nasc, v.sem);
  const hoje = new Date(); hoje.setHours(12,0,0,0);
  if(aplicada) return {status:'ok', aplicada, due};
  const d = diffDias(due, hoje);
  if(d < 0) return {status:'atrasada', due, dias: Math.abs(d)};
  if(d <= 30) return {status:'proxima', due, dias: d};
  return {status:'futura', due, dias: d};
}
function resumoVacinas(pet){
  const lista = PROTOCOLO[pet.especie] || [];
  let ok=0, atrasada=0, proxima=0, futura=0;
  lista.forEach(v=>{
    const s = statusVacina(pet, v).status;
    if(s==='ok') ok++; else if(s==='atrasada') atrasada++;
    else if(s==='proxima') proxima++; else futura++;
  });
  return {total:lista.length, ok, atrasada, proxima, futura};
}

function renderVacinas(){
  const picker = $('#vacinasPetPicker');
  const cont = $('#vacinasContent');
  if(state.pets.length === 0){
    picker.innerHTML = '';
    cont.innerHTML = `<div class="empty"><span class="e-ic">💉</span><h4>Nenhum pet cadastrado</h4></div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="abrirModalPet()">Cadastrar pet</button>`;
    return;
  }
  if(!state.petSelecionado || !state.pets.find(p=>p.id===state.petSelecionado)) state.petSelecionado = state.pets[0].id;
  if(state.pets.length > 1){
    picker.innerHTML = `<div class="chips" style="margin-bottom:14px">
      ${state.pets.map(p=>`<button class="chip ${p.id===state.petSelecionado?'active':''}"
        onclick="selecionarPet('${p.id}')">${p.emoji||'🐾'} ${esc(p.nome)}</button>`).join('')}

  } else picker.innerHTML = '';
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  const lista = PROTOCOLO[pet.especie] || [];
  const res = resumoVacinas(pet);
  let html = `<button class="btn btn-primary" style="margin-bottom:16px" onclick="abrirCarteiraVacina('${pet.id}')">
    <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm-8 12H6v-2h6v2zm6-4H6v-2h12v2zm0-4H6V6h12v2z"/></svg>

  </button>`;
  html += `<div class="card anim" style="margin-bottom:16px;padding:14px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <div class="pet-avatar ${pet.especie==='gato'?'cat':''}" style="width:46px;height:46px;font-size:23px;border-radius:14px">${pet.foto?`<img src="${pet.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:(pet.emoji||'🐾')}</div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:800">${esc(pet.nome)}</div>
        <div style="font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px">${fmtData(pet.nascimento)} · ${calcIdade(pet.nascimento)}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
      <div style="background:var(--secondary-soft);border-radius:12px;padding:9px 4px">
        <div style="font-size:17px;font-weight:800;color:#12897A">${res.ok}</div>
        <div style="font-size:9.5px;font-weight:800;color:#12897A">APLICADAS</div>
      </div>
      <div style="background:var(--accent-soft);border-radius:12px;padding:9px 4px">
        <div style="font-size:17px;font-weight:800;color:#B47800">${res.proxima}</div>
        <div style="font-size:9.5px;font-weight:800;color:#B47800">PRÓXIMAS</div>
      </div>
      <div style="background:var(--danger-soft);border-radius:12px;padding:9px 4px">
        <div style="font-size:17px;font-weight:800;color:#C42B50">${res.atrasada}</div>
        <div style="font-size:9.5px;font-weight:800;color:#C42B50">ATRASADAS</div>
      </div>
    </div>
  </div>`;
  const ordem = {atrasada:0, proxima:1, futura:2, ok:3};
  const itens = lista.map(v => ({v, st: statusVacina(pet, v)}))
    .sort((a,b)=>{
      if(ordem[a.st.status] !== ordem[b.st.status]) return ordem[a.st.status]-ordem[b.st.status];
      return a.st.due - b.st.due;
    });
  html += `<div class="sec-head"><div class="sec-title"><span class="dot"></span>Cronograma</div></div>`;
  html += '<div class="timeline">' + itens.map(({v,st})=>{
    let dateTxt = '', marcaHtml = '';
    if(st.status === 'ok'){
      dateTxt = '✅ Aplicada em ' + fmtData(st.aplicada.data);
      if(st.aplicada.marca) marcaHtml = `<div class="vac-marca">💉 ${esc(st.aplicada.marca)}</div>`;
    }
    else if(st.status === 'atrasada') dateTxt = '⚠️ Atrasada há ' + st.dias + ' dias';
    else if(st.status === 'proxima') dateTxt = '🔔 Em ' + st.dias + ' dias';
    else dateTxt = '📅 ' + fmtData(st.due.toISOString().slice(0,10));
    const rec = recomendarMarcas(pet, v.tipo);
    let recHtml = '';
    if(st.status !== 'ok' && rec.recomendada){
      recHtml = `<div style="font-size:10.5px;color:#6B31B8;font-weight:700;margin-top:6px;background:var(--purple-soft);padding:6px 9px;border-radius:8px;display:inline-block">💡 ${esc(rec.recomendada)}</div>`;
    }
    return `<div class="tl-item ${st.status}">
      <div class="tl-node"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
      <div class="vac-card">
        <div class="vac-head">
          <div style="flex:1">
            <div class="vac-name">${esc(v.nome)}</div>
            <div class="vac-obs">${esc(v.obs)}</div>
            ${marcaHtml}
          </div>
          <button class="check-btn ${st.status==='ok'?'done':''}" onclick="${st.status==='ok'?`desmarcarVacina('${pet.id}','${v.id}')`:`abrirModalAplicarVacina('${pet.id}','${v.id}')`}">
            <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          </button>
        </div>
        <div class="vac-foot">
          <span class="vac-date">${dateTxt}</span>
          <span style="font-size:10px;font-weight:800;color:var(--muted)">${v.sem} sem.</span>
        </div>
        ${recHtml}
      </div>
    </div>`;
  }).join('') + '</div>';
  cont.innerHTML = html;
  atualizarHeader();
}
function selecionarPet(id){ state.petSelecionado = id; renderVacinas(); }
function abrirModalAplicarVacina(petId, vacId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet) return;
  const vac = PROTOCOLO[pet.especie].find(v=>v.id === vacId);
  if(!vac) return;

  openModal(headPadrao('Aplicar vacina', vac.nome),
    `<div class="recomendacao-card">
      <div class="rc-head"><span>🐾</span><span class="rc-titulo">Recomendação</span></div>
      <p>${rec.recomendada ? 'Para a raça ' + esc(pet.raca||'SRD') + ', a marca indicada é ' + esc(rec.recomendada) + '.' : 'Selecione uma das marcas mais usadas.'}</p>

    <div class="field"><label>MARCA</label>
      <div class="marca-list" id="marcaList">
        ${rec.marcas.map(m=>`<div class="marca-chip ${m===rec.recomendada?'active':''}" data-marca="${esc(m)}" onclick="selMarca('${esc(m)}')">${esc(m)}</div>`).join('')}

function selMarca(marca){
  state.marcaVacinaSel = marca;
  const inputOutro = $('#vMarcaOutro');
  if(inputOutro) inputOutro.value = '';
  atualizarChips();
}
function atualizarChips(){
  $$('#marcaList .marca-chip').forEach(c => c.classList.toggle('active', c.dataset.marca === state.marcaVacinaSel));
}
function salvarAplicacaoVacina(petId, vacId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet) return;
  const data = $('#vData').value || hojeISO();
  const marcaInput = ($('#vMarcaOutro').value || '').trim();
  const marca = marcaInput || state.marcaVacinaSel || '';
  if(!pet.vacinas) pet.vacinas = {};
  pet.vacinas[vacId] = {data, marca, lote: $('#vLote').value.trim(), vet: $('#vVet').value.trim()};
  saveDB(); closeModal(); toast('Vacina registrada! 🎉');
  renderVacinas();
}
function desmarcarVacina(petId, vacId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet) return;
  openModal(headPadrao('Remover aplicação', 'Confirme'),
    `<div style="text-align:center;padding:12px 0">
      <div style="font-size:42px;margin-bottom:10px">⚠️</div>
      <div style="font-size:14px;font-weight:800;margin-bottom:8px">Remover aplicação?</div>
    </div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-danger" onclick="confirmarDesmarcar('${petId}','${vacId}')">Remover</button>`);
}
function confirmarDesmarcar(petId, vacId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet || !pet.vacinas) return;
  delete pet.vacinas[vacId];
  saveDB(); closeModal(); toast('Aplicação removida');
  renderVacinas();
}
function abrirCarteiraVacina(petId){
  const pet = state.pets.find(x=>x.id === petId);
  if(!pet) return;
  state.petSelecionado = petId;
  const lista = PROTOCOLO[pet.especie] || [];
  const aplicadas = [], pendentes = [], atrasadas = [];
  lista.forEach(v=>{
    const st = statusVacina(pet, v);
    if(st.status === 'ok') aplicadas.push({v, st});
    else if(st.status === 'atrasada') atrasadas.push({v, st});
    else pendentes.push({v, st});
  });
  aplicadas.sort((a,b)=> new Date(a.st.aplicada.data) - new Date(b.st.aplicada.data));
  pendentes.sort((a,b)=> a.st.due - b.st.due);
  atrasadas.sort((a,b)=> a.st.due - b.st.due);
  const total = lista.length, totalOk = aplicadas.length;
  const progresso = Math.round((totalOk/total)*100);
  let numSeq = 0;
  const renderVacItem = (item, tipo) => {
    numSeq++;
    const {v, st} = item;
    let statusTxt = '', dataTxt = '', marcaHtml = '';
    if(tipo === 'aplicada'){
      statusTxt = 'Aplicada'; dataTxt = '📅 ' + fmtData(st.aplicada.data);
      if(st.aplicada.marca) marcaHtml = `<div class="cv-marca">💉 ${esc(st.aplicada.marca)}</div>`;
    } else if(tipo === 'atrasada'){ statusTxt = 'Atrasada'; dataTxt = '⏰ ' + fmtData(st.due.toISOString().slice(0,10)); }
    else { statusTxt = 'Pendente'; dataTxt = '📅 ' + fmtData(st.due.toISOString().slice(0,10)); }
    return `<div class="carteira-vac ${tipo}">
      <div class="cv-num">${String(numSeq).padStart(2,'0')}</div>
      <div class="cv-body">
        <div class="cv-nome">${esc(v.nome)}</div>
        <div class="cv-data">${dataTxt}</div>
        ${marcaHtml}
      </div>
      <div class="cv-status">${statusTxt}</div>
    </div>`;
  };
  const avatar = pet.foto ? `<img src="${pet.foto}" style="width:100%;height:100%;object-fit:cover">` : (pet.emoji||'🐾');
  let html = `
    <div class="carteira">
      <div class="carteira-header">
        <div class="ch-titulo">Carteira de Vacinação</div>
        <h3>${esc(pet.nome)}</h3>
        <div class="ch-brasil">🇧🇷</div>
      </div>
      <div class="carteira-pet">
        <div class="cp-avatar ${pet.especie==='gato'?'cat':''}">${avatar}</div>
        <div class="cp-info">
          <div class="cp-nome">${esc(pet.nome)}</div>
          <div class="cp-sub">${pet.especie==='gato'?'Felino':'Canino'} · ${esc(pet.raca||'SRD')}</div>
          <div class="cp-linha">
            <span class="cp-chip">${calcIdade(pet.nascimento)}</span>
            <span class="cp-chip">${pet.sexo==='femea'?'Fêmea':'Macho'}</span>
            ${pet.peso?`<span class="cp-chip">${esc(pet.peso)} kg</span>`:''}
          </div>
        </div>
      </div>
      <div class="carteira-info">
        <div class="ci-item"><div class="ci-label">Nascimento</div><div class="ci-valor">${fmtData(pet.nascimento)}</div></div>
        <div class="ci-item"><div class="ci-label">Espécie</div><div class="ci-valor">${pet.especie==='gato'?'Gato':'Cão'}</div></div>
        <div class="ci-item"><div class="ci-label">Raça</div><div class="ci-valor">${esc(pet.raca||'SRD')}</div></div>
        <div class="ci-item"><div class="ci-label">Emitida em</div><div class="ci-valor">${fmtData(hojeISO())}</div></div>
      </div>
      <div class="carteira-secao">
        <div class="cs-titulo">📊 Resumo <span class="cs-count">${totalOk}/${total}</span></div>
        <div style="height:8px;background:#F1F4F9;border-radius:6px;overflow:hidden;margin-bottom:8px">
          <div style="height:100%;width:${progresso}%;background:linear-gradient(90deg,#25C2B0,#4AD4C3);border-radius:6px"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);font-weight:600;text-align:center">${progresso}% completo</div>
      </div>`;
  if(aplicadas.length > 0) html += `<div class="carteira-secao"><div class="cs-titulo">✅ Aplicadas <span class="cs-count">${aplicadas.length}</span></div>${aplicadas.map(a => renderVacItem(a, 'aplicada')).join('')}</div>`;
  if(atrasadas.length > 0) html += `<div class="carteira-secao"><div class="cs-titulo" style="color:var(--danger)">⚠️ Atraso <span class="cs-count" style="background:var(--danger-soft);color:#C42B50">${atrasadas.length}</span></div>${atrasadas.map(a => renderVacItem(a, 'atrasada')).join('')}</div>`;
  if(pendentes.length > 0) html += `<div class="carteira-secao"><div class="cs-titulo" style="color:#B47800">⏳ Pendentes <span class="cs-count" style="background:var(--accent-soft);color:#B47800">${pendentes.length}</span></div>${pendentes.map(p => renderVacItem(p, 'pendente')).join('')}</div>`;
  html += `
      <div class="carteira-assinatura">
        <div><div class="ca-txt">Assinatura do Médico Veterinário</div><div class="ca-trace">CRMV</div></div>
        <div><div class="ca-txt">Assinatura do Tutor</div><div class="ca-trace">Nome</div></div>
      </div>
      <div class="carteira-rodape">
        <div class="cr-app"><div class="cr-logo">🐾</div><span>PetVida</span></div>
        <div>Documento · ${fmtData(hojeISO())}</div>
      </div>
    </div>
    <div class="carteira-alerta">
      <div>ℹ️</div>
      <div>Esta carteira digital <strong>não substitui</strong> a oficial do veterinário.</div>
    </div>`;
  openModal(headPadrao('Carteira de Vacinação', pet.nome), html,
    `<button class="btn btn-soft" onclick="closeModal()">Fechar</button>
     <button class="btn btn-primary" onclick="closeModal();goTo(3)">Gerenciar</button>`);
}
function abrirModalIdadeReal(petId){

const SAUDE_SUBS = [
  {id:'visao', label:'📋 Visão'},
  {id:'historico', label:'🏥 Histórico'},
  {id:'prevencao', label:'💊 Prevenção'},
  {id:'diario', label:'📔 Diário'},
