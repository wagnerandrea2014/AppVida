function setSaudeSub(sub){ state.saudeSub = sub; renderSaude(); }
function renderSaude(){
  const subnav = $('#saudeSubnav');
  const el = $('#saudeContent');
  if(state.pets.length === 0){
    subnav.innerHTML = '';
    el.innerHTML = `<div class="empty"><span class="e-ic">❤️</span><h4>Nenhum pet cadastrado</h4></div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="abrirModalPet()">Cadastrar pet</button>`;
    return;
  }
  if(!state.petSelecionado || !state.pets.find(p=>p.id===state.petSelecionado)) state.petSelecionado = state.pets[0].id;
  subnav.innerHTML = `<div class="subnav">${SAUDE_SUBS.map(s=>
    `<button class="subnav-btn ${state.saudeSub===s.id?'active':''}" onclick="setSaudeSub('${s.id}')">${s.label}</button>`
  ).join('')}</div>`;
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  let petPicker = '';
  if(state.pets.length > 1){
    petPicker = `<div class="chips" style="margin-bottom:14px">
      ${state.pets.map(p=>`<button class="chip ${p.id===state.petSelecionado?'active':''}"
        onclick="selecionarPetSaude('${p.id}')">${p.emoji||'🐾'} ${esc(p.nome)}</button>`).join('')}
    </div>`;
  }
  let body = petPicker;
  switch(state.saudeSub){
    case 'historico': body += renderSaudeHistorico(pet); break;
    case 'prevencao': body += renderSaudePrevencao(pet); break;
    case 'diario':   body += renderSaudeDiario(pet); break;
    case 'tutores':  body += renderSaudeTutores(pet); break;
    case 'emergencia': body += renderSaudeEmergencia(); break;
    case 'guias':    body += renderSaudeGuias(); break;
    default:         body += renderSaudeVisao(pet);
  }
  el.innerHTML = body;
}

  const pet = state.pets.find(p=>p.id === petId);
  if(!pet) return;
  if(!pet.cuidados) pet.cuidados = [];
  const i = pet.cuidados.indexOf(cid);
  if(i === -1) pet.cuidados.push(cid);
  else pet.cuidados.splice(i,1);
  saveDB(); renderSaude();
}
function delHistorico(petId, cat, id){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet || !pet.historico) return;
  pet.historico[cat] = pet.historico[cat].filter(x=>x.id !== id);
  saveDB(); renderSaude(); toast('Registro removido');
}
function delAntipulgas(petId, id){
  const pet = state.pets.find(p=>p.id === petId);

============================================================ */
function openModal(headHTML, bodyHTML, footHTML){
  $('#modalHead').innerHTML = headHTML;
  $('#modalBody').innerHTML = bodyHTML;
  $('#modalFoot').innerHTML = footHTML || '';
  $('#modalFoot').style.display = footHTML ? 'flex' : 'none';
  $('#modalBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#modalBody').scrollTop = 0;
}
function closeModal(){
  $('#modalBackdrop').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeModal(); });
function headPadrao(titulo, sub){

function setFormEmoji(e){ formPet.emoji = e; formPet.foto = null; $('#modalBody').innerHTML = formPetHTML(); }
function abrirUploadFoto(){ $('#fileFoto').click(); }
function processarFoto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 2 * 1024 * 1024){ toast('Foto muito grande (máx 2MB)'); return; }
  const reader = new FileReader();
  reader.onload = e => { formPet.foto = e.target.result; $('#modalBody').innerHTML = formPetHTML(); };
  reader.readAsDataURL(file);
}
function salvarPet(){
  const nome = ($('#fNome') ? $('#fNome').value : formPet.nome).trim();
  const nasc = $('#fNasc') ? $('#fNasc').value : formPet.nascimento;
  const raca = $('#fRaca') ? $('#fRaca').value : formPet.raca;
  if(!nome){ toast('Informe o nome'); return; }
  if(!nasc){ toast('Informe a data de nascimento'); return; }
  if(new Date(nasc + 'T12:00:00') > new Date()){ toast('Data não pode ser no futuro'); return; }
  const pesoStr = formPet.peso ? String(formPet.peso).replace(',','.') : '';
  if(formPet.id){
    const p = state.pets.find(x=>x.id === formPet.id);
    if(!p) return;
    p.nome = nome; p.especie = formPet.especie; p.raca = raca || 'SRD';
    p.nascimento = nasc; p.sexo = formPet.sexo; p.peso = pesoStr; p.emoji = formPet.emoji; p.foto = formPet.foto;
    toast('Pet atualizado! ✨');
  } else {
    const pet = {
      id: uid(), nome, especie: formPet.especie, raca: raca || 'SRD',
      nascimento: nasc, sexo: formPet.sexo, peso: pesoStr, emoji: formPet.emoji, foto: formPet.foto,
      vacinas: {}, cuidados: [], pesos: pesoStr ? [{data: hojeISO(), valor: pesoStr}] : [],
      historico: {consultas:[],exames:[],medicamentos:[],cirurgias:[],alergias:[]},
      antipulgas: [], cio: [], diario: [], tutores: [],
      criado: new Date().toISOString()
    };
    state.pets.push(pet);
    state.petSelecionado = pet.id;
    toast('Pet cadastrado! 🎉');
  }
  saveDB(); closeModal();
  renderPage(state.currentPage); atualizarHeader();

  if(!state.petSelecionado){ toast('Selecione um pet'); return; }
  const humores = [{id:'feliz',emoji:'😊',label:'Feliz'},{id:'calmo',emoji:'😌',label:'Calmo'},{id:'agitado',emoji:'😰',label:'Agitado'},{id:'triste',emoji:'😢',label:'Triste'},{id:'doente',emoji:'🤒',label:'Doente'}];
  openModal(headPadrao('Diário', 'Como foi o dia?'),
    `<div class="field"><label>HUMOR *</label>
      <div class="humor-grid">${humores.map((h,i)=>`<div class="humor-opt ${i===0?'active':''}" data-humor="${h.id}" onclick="selHumor('${h.id}')"><span class="ho-emoji">${h.emoji}</span><span class="ho-lbl">${h.label}</span></div>`).join('')}</div>
    </div>
    <div class="field"><label>DATA</label><input class="input" type="date" id="hdData" value="${hojeISO()}"></div>
    <div class="field"><label>OBSERVAÇÕES</label><textarea class="textarea" id="hdNota"></textarea></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarDiario()">Salvar</button>`);
}
let humorSelecionado = 'feliz';
function selHumor(id){ humorSelecionado = id; $$('.humor-opt').forEach(o => o.classList.toggle('active', o.dataset.humor === id)); }
function salvarDiario(){
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  if(!pet) return;
  if(!pet.diario) pet.diario = [];
  pet.diario.push({id:uid(), humor:humorSelecionado, data:$('#hdData').value||hojeISO(), nota:$('#hdNota').value.trim()});
  saveDB(); closeModal(); toast('Registro salvo! 📔'); renderSaude();
}
function abrirModalTutor(){
  if(!state.petSelecionado){ toast('Selecione um pet'); return; }
  const parentescos = ['Tutor principal','Cônjuge','Filho(a)','Veterinário(a)','Outro'];
  openModal(headPadrao('Novo tutor', 'Adicione um tutor'),
    `<div class="field"><label>NOME *</label><input class="input" id="htNome"></div>
    <div class="field"><label>PAPEL</label>
      <select class="select" id="htParentesco">${parentescos.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>TELEFONE</label><input class="input" id="htTel" type="tel"></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarTutor()">Salvar</button>`);
}
function salvarTutor(){
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  if(!pet) return;
  const nome = $('#htNome').value.trim();
  if(!nome){ toast('Informe o nome'); return; }
  if(!pet.tutores) pet.tutores = [];
  pet.tutores.push({id:uid(), nome, parentesco:$('#htParentesco').value, telefone:$('#htTel').value.trim()});
  saveDB(); closeModal(); toast('Tutor adicionado! 👥'); renderSaude();
}
function abrirModalIDDigital(petId){
  const id = petId || state.petSelecionado;
  const pet = state.pets.find(p=>p.id === id);
  if(!pet){ toast('Pet não encontrado'); return; }
  state.petSelecionado = id;
  const codigo = gerarIdPet(pet);
  const tutor = (pet.tutores||[])[0];
  const contato = tutor ? (tutor.telefone || '—') : '—';
  const alergias = (pet.historico && pet.historico.alergias || []).map(a=>a.tipo).join(', ') || 'Nenhuma';
  openModal(headPadrao('ID Digital', pet.nome),
    `<div class="id-digital">
      <div class="idd-top">
        <div>
          <div class="idd-titulo">ID Digital PetVida</div>
          <div class="idd-nome" style="margin-top:6px">${esc(pet.nome)}</div>
          <div class="idd-sub">${pet.especie==='gato'?'Felino':'Canino'} · ${esc(pet.raca||'SRD')} · ${calcIdade(pet.nascimento)}</div>
        </div>
        <div class="idd-logo">🐾</div>
      </div>
      <div class="idd-grid">
        <div class="idd-item"><div class="idd-item-l">Código</div><div class="idd-item-v" style="font-family:'Courier New',monospace">${codigo}</div></div>
        <div class="idd-item"><div class="idd-item-l">Idade humana</div><div class="idd-item-v">${idadeHumana(pet)}</div></div>
        <div class="idd-item"><div class="idd-item-l">Sexo</div><div class="idd-item-v">${pet.sexo==='femea'?'Fêmea':'Macho'}</div></div>
        <div class="idd-item"><div class="idd-item-l">Peso</div><div class="idd-item-v">${pet.peso?esc(pet.peso)+' kg':'—'}</div></div>
      </div>
      <div class="idd-qr">
        <div class="idd-qr-pattern">${padraoQr(pet, 74)}</div>
        <div class="idd-qr-info">
          <div class="idd-qr-code">${codigo}</div>
          <div class="idd-qr-txt">Apresente em caso de perda ou emergência.</div>
        </div>
      </div>
      <div class="idd-footer"><span>📞 ${esc(contato)}</span><span>${fmtData(hojeISO())}</span></div>
    </div>
    <div class="blk warn"><h4><span class="b-ic">⚠️</span>Alergias</h4><p>${esc(alergias)}</p></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Fechar</button>
     <button class="btn btn-primary" onclick="compartilharID('${pet.id}')">Compartilhar</button>`);
}
function compartilharID(petId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet) return;
  const codigo = gerarIdPet(pet);
  const texto = `🐾 ID DIGITAL - ${pet.nome}\n\nCódigo: ${codigo}\nIdade: ${calcIdade(pet.nascimento)}\nGerado pelo PetVida em ${fmtData(hojeISO())}`;
  if(navigator.share) navigator.share({title:'ID Digital - ' + pet.nome, text: texto}).catch(()=>{});
  else if(navigator.clipboard) navigator.clipboard.writeText(texto).then(()=> toast('ID copiado! 📋')).catch(()=> toast('Não foi possível copiar'));
  else toast('Compartilhamento não disponível');
}
function abrirModalAjuda(){
  openModal(headPadrao('Como usar o PetVida', 'Guia rápido'),
    `<div class="blk" style="background:linear-gradient(140deg,#F3EAFE,#E9DDFB);border-color:#D9C4F5">
      <h4><span class="b-ic" style="background:rgba(155,93,229,.20);color:#6B31B8">🤖</span>Dr. Pet IA</h4>
      <p>Seu assistente veterinário inteligente! Já vem com uma <strong>base de conhecimento offline especializada</strong> e, se você configurar uma chave de API, conecta com <strong>Google Gemini</strong>, <strong>OpenAI</strong> ou <strong>Claude</strong> para respostas ainda mais avançadas.</p>
    </div>
    <div class="blk"><h4><span class="b-ic">👆</span>Navegação</h4><p>Deslize o dedo para trocar de página ou use a barra inferior.</p></div>
    <div class="blk"><h4><span class="b-ic">💾</span>Backup</h4><p>Use o botão de backup no topo para salvar, exportar ou restaurar os dados.</p></div>
    <div class="blk"><h4><span class="b-ic">💉</span>Vacinas</h4><p>Registre marca, lote e veterinário em cada aplicação.</p></div>
    <div class="blk"><h4><span class="b-ic">🩺</span>Doenças</h4><p>Guia completo com classificação de risco, sintomas, prevenção e tratamento.</p></div>
    <div class="blk warn"><h4><span class="b-ic">⚕️</span>Aviso importante</h4><p>Este aplicativo é uma ferramenta de apoio ao tutor e <strong>não substitui a consulta veterinária</strong>. Em emergências, procure atendimento profissional imediatamente.</p></div>`,
    `<button class="btn btn-primary" onclick="closeModal()">Entendi</button>`);
}

/* ============================================================
   INICIALIZAÇÃO
============================================================ */
function init(){
  loadDB();
  loadIAConfig();
  loadChatHistory();
  if(state.pets.length > 0) state.petSelecionado = state.pets[0].id;
  if(state.pets.length > 0 && getBackups().length === 0) fazerBackupAutomatico('Inicial');
  $$('.page').forEach((p, idx) => p.classList.toggle('active', idx === 0));
  goTo(0);
  atualizarHeader();
  atualizarFAB();
  atualizarBadgeBackup();
}
init();

let lastTouch = 0;
document.addEventListener('touchend', e=>{
  const now = Date.now();
  if(now <= lastTouch + 300 && !e.target.closest('.chat-input') && !e.target.closest('input') && !e.target.closest('textarea')) e.preventDefault();
  lastTouch = now;
}, {passive:false});
window.addEventListener('beforeunload', saveDB);

setInterval(()=>{
  if(state.pets.length > 0) fazerBackupAutomatico('Automático');
}, 30 * 60 * 1000);
</script>
</body>
</html>
