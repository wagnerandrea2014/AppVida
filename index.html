function quickItem(emoji, cor, label, fn){
  const click = fn ? `onclick="${fn}"` : '';
  return `<button class="quick" ${click} type="button">
    <div class="quick-ic" style="background:${cor}"><span style="font-size:18px">${emoji}</span></div>
    <span>${label}</span>
  </button>`;
}
function blocoDica(){
  const dicas = [
    {tag:'Dr. Pet IA + 🌐', t:'Pesquisa na internet!', p:'O Dr. Pet IA agora busca dados atualizados no Google e mostra as fontes consultadas ao final da resposta.'},
    {tag:'Álbum', t:'Registre a evolução', p:'Salve fotos do seu pet em Saúde → 📸 Álbum e veja como ele cresceu.'},
    {tag:'Backup', t:'Proteja os dados', p:'Exporte o arquivo JSON periodicamente.'}
  ];
  const d = dicas[Math.floor(Math.random()*dicas.length)];
  return `<div class="sec-head"><div class="sec-title"><span class="dot"></span>Dica do dia</div></div>
    <div class="tip-card anim">
      <span class="tip-tag">${d.tag}</span>
      <h4>${d.t}</h4>
      <p>${d.p}</p>
    </div>`;
}
function calcularProximoEvento(){
  let melhor = null;
  state.pets.forEach(p=>{
    (PROTOCOLO[p.especie]||[]).forEach(v=>{
      const st = statusVacina(p, v);
      if(st.status === 'ok') return;
      const peso = st.status === 'atrasada' ? -10000 + (st.dias||0) : (st.dias||9999);
      if(!melhor || peso < melhor.peso){
        let dataTxt;
        if(st.status === 'atrasada') dataTxt = 'Atrasada há ' + st.dias + ' dias';
        else dataTxt = 'Prevista para ' + fmtData(st.due.toISOString().slice(0,10));
        melhor = {peso, petId:p.id, petNome:p.nome, titulo:v.nome, obs:v.obs, status:st.status, dataTxt};
      }
    });
  });
  return melhor;
}
function petCardHTML(p, i){
  const r = resumoVacinas(p);
  let badge = '';
  if(r.atrasada > 0) badge = `<span class="badge badge-late">${r.atrasada} atrasada${r.atrasada>1?'s':''}</span>`;
  else if(r.proxima > 0) badge = `<span class="badge badge-warn">${r.proxima} próxima${r.proxima>1?'s':''}</span>`;
  else badge = `<span class="badge badge-ok">Em dia</span>`;
  const esp = p.especie === 'gato' ? 'Gato' : 'Cão';
  const avatar = p.foto ? `<img src="${p.foto}" alt="${esc(p.nome)}">` : (p.emoji || (p.especie==='gato'?'🐈':'🐕'));
  const albumCount = (p.album || []).length;
  return `<div class="pet-card anim d${Math.min(i+1,4)}" onclick="abrirDetalhePet('${p.id}')">
    <div class="pet-avatar ${p.especie==='gato'?'cat':''}">${avatar}</div>
    <div class="pet-info">
      <div class="pet-name">${esc(p.nome)}</div>
      <div class="pet-meta">${esp} · ${esc(p.raca || 'SRD')} · ${calcIdade(p.nascimento)}</div>
      <div class="pet-badges">
        ${badge}
        ${albumCount > 0 ? `<span class="badge badge-info">📸 ${albumCount}</span>` : ''}
      </div>
    </div>
    <div class="pet-chevron"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></div>
  </div>`;
}

function renderVacinas(){
  const picker = $('#vacinasPetPicker');

    picker.innerHTML = '';

  }
  if(!state.petSelecionado || !state.pets.find(p=>p.id===state.petSelecionado)) state.petSelecionado = state.pets[0].id;
  if(state.pets.length > 1){
    picker.innerHTML = `<div class="chips" style="margin-bottom:14px">
      ${state.pets.map(p=>`<button class="chip ${p.id===state.petSelecionado?'active':''}"
        onclick="selecionarPet('${p.id}')" type="button">${p.emoji||'🐾'} ${esc(p.nome)}</button>`).join('')}
    </div>`;
  } else picker.innerHTML = '';
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  const lista = PROTOCOLO[pet.especie] || [];
  const res = resumoVacinas(pet);

  let html = `<button class="btn btn-primary" style="margin-bottom:16px" onclick="abrirCarteiraVacina('${pet.id}')" type="button">
    <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm-8 12H6v-2h6v2zm6-4H6v-2h12v2zm0-4H6V6h12v2z"/></svg>
    Abrir Carteira
  </button>`;
  html += `<div class="card anim" style="margin-bottom:16px;padding:14px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <div class="pet-avatar ${pet.especie==='gato'?'cat':''}" style="width:46px;height:46px;font-size:23px;border-radius:14px">${pet.foto?`<img src="${pet.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:(pet.emoji||'🐾')}</div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:800">${esc(pet.nome)}</div>
        <div style="font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px">${fmtData(pet.nascimento)} · ${calcIdade(pet.nascimento)}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
      <div style="background:var(--secondary-soft);border-radius:12px;padding:9px 4px">
        <div style="font-size:17px;font-weight:800;color:#12897A">${res.ok}</div>
        <div style="font-size:9.5px;font-weight:800;color:#12897A">OK</div>
      </div>
      <div style="background:var(--accent-soft);border-radius:12px;padding:9px 4px">
        <div style="font-size:17px;font-weight:800;color:#B47800">${res.proxima}</div>
        <div style="font-size:9.5px;font-weight:800;color:#B47800">PRÓXIMAS</div>
      </div>
      <div style="background:var(--danger-soft);border-radius:12px;padding:9px 4px">
        <div style="font-size:17px;font-weight:800;color:#C42B50">${res.atrasada}</div>
        <div style="font-size:9.5px;font-weight:800;color:#C42B50">ATRASADAS</div>
      </div>
    </div>
  </div>`;
  const ordem = {atrasada:0, proxima:1, futura:2, ok:3};
  const itens = lista.map(v => ({v, st: statusVacina(pet, v)}))
    .sort((a,b)=>{
      if(ordem[a.st.status] !== ordem[b.st.status]) return ordem[a.st.status]-ordem[b.st.status];
      return a.st.due - b.st.due;
    });
  html += '<div class="timeline">' + itens.map(({v,st})=>{
    let dateTxt = '', marcaHtml = '';
    if(st.status === 'ok'){
      dateTxt = '✅ ' + fmtData(st.aplicada.data);
      if(st.aplicada.marca) marcaHtml = `<div class="vac-marca">💉 ${esc(st.aplicada.marca)}</div>`;
    }
    else if(st.status === 'atrasada') dateTxt = '⚠️ Atrasada há ' + st.dias + 'd';
    else if(st.status === 'proxima') dateTxt = '🔔 Em ' + st.dias + 'd';
    else dateTxt = '📅 ' + fmtData(st.due.toISOString().slice(0,10));
    return `<div class="tl-item ${st.status}">

      </div>
    </div>`;
  }).join('') + '</div>';
  cont.innerHTML = html;
  atualizarHeader();

function abrirModalAplicarVacina(petId, vacId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet) return;
  const vac = PROTOCOLO[pet.especie].find(v=>v.id === vacId);
  if(!vac) return;
  const rec = recomendarMarcas(pet, vac.tipo);
  state.marcaVacinaSel = rec.recomendada || '';
  openModal(headPadrao('Aplicar vacina', vac.nome),
    `<div class="field"><label>DATA *</label><input class="input" type="date" id="vData" value="${hojeISO()}" max="${hojeISO()}"></div>
    <div class="field"><label>MARCA</label>
      <div class="marca-list" id="marcaList">
        ${rec.marcas.map(m=>`<div class="marca-chip ${m===rec.recomendada?'active':''}" data-marca="${esc(m)}" onclick="selMarca('${esc(m)}')">${esc(m)}</div>`).join('')}
      </div>
      <input class="input" id="vMarcaOutro" placeholder="Outra..." style="margin-top:10px" oninput="state.marcaVacinaSel=this.value;atualizarChips()">
    </div>
    <div class="row-2">
      <div class="field"><label>LOTE</label><input class="input" id="vLote"></div>
      <div class="field"><label>VET</label><input class="input" id="vVet"></div>
    </div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarAplicacaoVacina('${petId}','${vacId}')">Salvar</button>`);
}
function selMarca(marca){
  state.marcaVacinaSel = marca;
  const inputOutro = $('#vMarcaOutro');
  if(inputOutro) inputOutro.value = '';
  atualizarChips();
}
function atualizarChips(){
  $$('#marcaList .marca-chip').forEach(c => c.classList.toggle('active', c.dataset.marca === state.marcaVacinaSel));
}
function salvarAplicacaoVacina(petId, vacId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet) return;
  const data = $('#vData').value || hojeISO();
  const marcaInput = ($('#vMarcaOutro').value || '').trim();
  const marca = marcaInput || state.marcaVacinaSel || '';
  if(!pet.vacinas) pet.vacinas = {};
  pet.vacinas[vacId] = {data, marca, lote: $('#vLote').value.trim(), vet: $('#vVet').value.trim()};
  saveDB(); closeModal(); toast('Vacina registrada! 🎉');
  renderVacinas();
}
function desmarcarVacina(petId, vacId){
  openModal(headPadrao('Remover aplicação', 'Confirme'),
    `<div style="text-align:center;padding:12px 0">
      <div style="font-size:42px;margin-bottom:10px">⚠️</div>
      <div style="font-size:14px;font-weight:800">Remover?</div>
    </div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-danger" onclick="confirmarDesmarcar('${petId}','${vacId}')">Remover</button>`);
}
function confirmarDesmarcar(petId, vacId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet || !pet.vacinas) return;
  delete pet.vacinas[vacId];
  saveDB(); closeModal(); toast('Removida');
  renderVacinas();
}

/* ============================================================
   CARTEIRA
============================================================ */
function abrirCarteiraVacina(petId){
  const pet = state.pets.find(x=>x.id === petId);
  if(!pet) return;
  state.petSelecionado = petId;
  const lista = PROTOCOLO[pet.especie] || [];
  const aplicadas = [], pendentes = [], atrasadas = [];
  lista.forEach(v=>{
    const st = statusVacina(pet, v);
    if(st.status === 'ok') aplicadas.push({v, st});
    else if(st.status === 'atrasada') atrasadas.push({v, st});
    else pendentes.push({v, st});
  });
  const total = lista.length, totalOk = aplicadas.length;
  const progresso = Math.round((totalOk/total)*100);
  let numSeq = 0;
  const renderVacItem = (item, tipo) => {
    numSeq++;
    const {v, st} = item;
    let statusTxt = '', dataTxt = '', marcaHtml = '';
    if(tipo === 'aplicada'){
      statusTxt = 'Aplicada'; dataTxt = '📅 ' + fmtData(st.aplicada.data);
      if(st.aplicada.marca) marcaHtml = `<div class="cv-marca">💉 ${esc(st.aplicada.marca)}</div>`;
    } else if(tipo === 'atrasada'){ statusTxt = 'Atrasada'; dataTxt = '⏰ ' + fmtData(st.due.toISOString().slice(0,10)); }
    else { statusTxt = 'Pendente'; dataTxt = '📅 ' + fmtData(st.due.toISOString().slice(0,10)); }
    return `<div class="carteira-vac ${tipo}">
      <div class="cv-num">${String(numSeq).padStart(2,'0')}</div>
      <div class="cv-body">
        <div class="cv-nome">${esc(v.nome)}</div>
        <div class="cv-data">${dataTxt}</div>
        ${marcaHtml}
      </div>
      <div class="cv-status">${statusTxt}</div>
    </div>`;
  };
  const avatar = pet.foto ? `<img src="${pet.foto}" style="width:100%;height:100%;object-fit:cover">` : (pet.emoji||'🐾');
  let html = `
    <div class="carteira">
      <div class="carteira-header">
        <div class="ch-titulo">Carteira de Vacinação</div>
        <h3>${esc(pet.nome)}</h3>
        <div class="ch-brasil">🇧🇷</div>
      </div>
      <div class="carteira-pet">
        <div class="cp-avatar ${pet.especie==='gato'?'cat':''}">${avatar}</div>
        <div class="cp-info">
          <div class="cp-nome">${esc(pet.nome)}</div>
          <div class="cp-sub">${pet.especie==='gato'?'Felino':'Canino'} · ${esc(pet.raca||'SRD')}</div>
          <div class="cp-linha">
            <span class="cp-chip">${calcIdade(pet.nascimento)}</span>
            <span class="cp-chip">${pet.sexo==='femea'?'Fêmea':'Macho'}</span>
            ${pet.peso?`<span class="cp-chip">${esc(pet.peso)} kg</span>`:''}
          </div>
        </div>
      </div>
      <div class="carteira-info">
        <div class="ci-item"><div class="ci-label">Nascimento</div><div class="ci-valor">${fmtData(pet.nascimento)}</div></div>
        <div class="ci-item"><div class="ci-label">Espécie</div><div class="ci-valor">${pet.especie==='gato'?'Gato':'Cão'}</div></div>
        <div class="ci-item"><div class="ci-label">Raça</div><div class="ci-valor">${esc(pet.raca||'SRD')}</div></div>
        <div class="ci-item"><div class="ci-label">Emitida em</div><div class="ci-valor">${fmtData(hojeISO())}</div></div>
      </div>
      <div class="carteira-secao">
        <div class="cs-titulo">📊 Resumo <span class="cs-count">${totalOk}/${total}</span></div>
        <div style="height:8px;background:#F1F4F9;border-radius:6px;overflow:hidden;margin-bottom:8px">
          <div style="height:100%;width:${progresso}%;background:linear-gradient(90deg,#25C2B0,#4AD4C3);border-radius:6px"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);font-weight:600;text-align:center">${progresso}% completo</div>

const SAUDE_SUBS = [
  {id:'visao', label:'📋 Visão'},
  {id:'album', label:'📸 Álbum'},
  {id:'historico', label:'🏥 Histórico'},
  {id:'prevencao', label:'💊 Prevenção'},

function setSaudeSub(sub){ state.saudeSub = sub; renderSaude(); }
function renderSaude(){
  const subnav = $('#saudeSubnav');
  const el = $('#saudeContent');
  if(state.pets.length === 0){
    subnav.innerHTML = '';
    el.innerHTML = `<div class="empty"><span class="e-ic">❤️</span><h4>Nenhum pet</h4></div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="abrirModalPet()">Cadastrar</button>`;
    return;
  }
  if(!state.petSelecionado || !state.pets.find(p=>p.id===state.petSelecionado)) state.petSelecionado = state.pets[0].id;
  subnav.innerHTML = `<div class="subnav">${SAUDE_SUBS.map(s=>
    `<button class="subnav-btn ${state.saudeSub===s.id?'active':''}" onclick="setSaudeSub('${s.id}')" type="button">${s.label}</button>`
  ).join('')}</div>`;
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  let petPicker = '';
  if(state.pets.length > 1){
    petPicker = `<div class="chips" style="margin-bottom:14px">
      ${state.pets.map(p=>`<button class="chip ${p.id===state.petSelecionado?'active':''}"
        onclick="selecionarPetSaude('${p.id}')" type="button">${p.emoji||'🐾'} ${esc(p.nome)}</button>`).join('')}
    </div>`;
  }
  let body = petPicker;
  switch(state.saudeSub){
    case 'album': body += renderSaudeAlbum(pet); break;
    case 'historico': body += renderSaudeHistorico(pet); break;
    case 'prevencao': body += renderSaudePrevencao(pet); break;
    case 'diario': body += renderSaudeDiario(pet); break;
    case 'tutores': body += renderSaudeTutores(pet); break;
    case 'emergencia': body += renderSaudeEmergencia(); break;
    case 'guias': body += renderSaudeGuias(); break;
    default: body += renderSaudeVisao(pet);
  }
  el.innerHTML = body;
}

    <button class="sec-link" onclick="abrirModalPeso()">+ Registrar</button></div>`;

    html += `<div class="card" style="text-align:center;padding:22px">
      <div style="font-size:30px;margin-bottom:8px">⚖️</div>
      <div style="font-size:13px;font-weight:800;margin-bottom:14px">Nenhuma pesagem</div>
      <button class="btn btn-ghost btn-sm" style="width:100%" onclick="abrirModalPeso()">Registrar</button>
    </div>`;
  } else {
    const max = Math.max(...pesos.map(p=>parseFloat(p.valor)));
    const min = Math.min(...pesos.map(p=>parseFloat(p.valor)));
    const range = Math.max(0.5, max - min);
    html += `<div class="card anim" style="margin-bottom:12px">
      <div class="bar-chart">
        ${pesos.slice(-6).map(p=>{
          const v = parseFloat(p.valor);
          const h = 20 + ((v - min) / range) * 70;
          const dt = new Date(p.data + 'T12:00:00');
          return `<div class="bar-col">
            <div class="bar-val">${v}</div>
            <div class="bar" style="height:${h}%"></div>
            <div class="bar-lbl">${dt.getDate()}/${dt.getMonth()+1}</div>
          </div>`;
        }).join('')}

    </div>`;
  }
  html += `<div class="sec-head"><div class="sec-title"><span class="dot"></span>Primeiros cuidados</div>
    <span style="font-size:10.5px;font-weight:800;color:var(--muted)">${(pet.cuidados||[]).length}/${PRIMEIROS_CUIDADOS[pet.especie].length}</span></div>`;

    const done = (pet.cuidados||[]).indexOf(c.id) !== -1;
    return `<div class="check-item ${done?'done':''}" onclick="toggleCuidado('${pet.id}','${c.id}')">
      <div class="check-box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
      <div class="check-txt"><h5>${esc(c.t)}</h5><p>${esc(c.d)}</p></div>
    </div>`;
  }).join('');
  return html;
}

function renderSaudeAlbum(pet){
  const album = (pet.album || []).slice().sort((a,b) => new Date(b.data) - new Date(a.data));
  let html = '';

  if(album.length > 0){
    const primeira = album[album.length - 1];
    const ultima = album[0];
    const primeiroAno = primeira.data ? new Date(primeira.data + 'T12:00:00').getFullYear() : '—';
    const ultimoAno = ultima.data ? new Date(ultima.data + 'T12:00:00').getFullYear() : '—';
    html += `<div class="album-stats">
      <div class="album-stat"><div class="album-stat-n">${album.length}</div><div class="album-stat-l">Fotos</div></div>
      <div class="album-stat"><div class="album-stat-n">${primeiroAno === ultimoAno ? primeiroAno : primeiroAno + '–' + ultimoAno}</div><div class="album-stat-l">Período</div></div>
    </div>`;
  }

  html += `<button class="btn btn-primary" style="margin-bottom:14px" onclick="abrirModalAddFotoAlbum('${pet.id}')" type="button">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    Adicionar foto
  </button>`;

  if(album.length === 0){
    html += `<div class="empty">
      <span class="e-ic">📸</span>
      <h4>Álbum vazio</h4>
      <p>Registre a evolução do seu pet com fotos!</p>
    </div>`;
    return html;
  }

  const grupos = {};
  album.forEach(f => {
    const d = f.data ? new Date(f.data + 'T12:00:00') : new Date();
    const chave = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    if(!grupos[chave]) grupos[chave] = [];
    grupos[chave].push(f);
  });

  const mesesNomes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const chavesOrd = Object.keys(grupos).sort().reverse();

  html += `<div class="album-timeline">`;
  chavesOrd.forEach(chave => {
    const [ano, mes] = chave.split('-');
    const label = mesesNomes[parseInt(mes)-1] + ' ' + ano;
    html += `<div class="album-tl-group">
      <div class="album-tl-dot"></div>
      <div class="album-tl-label">${label}</div>
      <div class="album-tl-grid">
        ${grupos[chave].map(f => `
          <div class="album-item" onclick="abrirFotoAlbum('${pet.id}','${f.id}')">
            <img src="${f.foto}" alt="" loading="lazy">
            ${f.titulo ? `<div class="album-info"><div class="album-titulo">${esc(f.titulo)}</div></div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function trocarFotoAlbum(){
  formAlbum.foto = null;
  $('#modalBody').innerHTML = formAlbumHTML();
}

function processarFotoAlbum(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 15 * 1024 * 1024){ toast('Foto muito grande (máx 15MB)'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    redimensionarImagem(e.target.result, 800, 0.78, (dataUrl) => {
      formAlbum.foto = dataUrl;
      const body = $('#modalBody');
      if(body) body.innerHTML = formAlbumHTML();
    });
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function salvarFotoAlbum(){
  if(!formAlbum.foto){ toast('Adicione uma foto'); return; }
  const pet = state.pets.find(p => p.id === formAlbum.petId);
  if(!pet){ toast('Pet não encontrado'); return; }
  if(!pet.album) pet.album = [];
  const idadePet = calcularIdadeNaData(pet.nascimento, formAlbum.data);
  pet.album.push({
    id: uid(),
    foto: formAlbum.foto,
    titulo: (formAlbum.titulo || '').trim(),
    nota: (formAlbum.nota || '').trim(),
    data: formAlbum.data || hojeISO(),
    idadePet,
    criado: new Date().toISOString()
  });
  saveDB();
  closeModal();
  toast('Foto adicionada! 📸');
  state.saudeSub = 'album';
  renderSaude();
}

function abrirFotoAlbum(petId, fotoId){
  const pet = state.pets.find(p => p.id === petId);
  if(!pet || !pet.album) return;
  const foto = pet.album.find(f => f.id === fotoId);
  if(!foto) return;
  const body = `
    <div class="album-preview" style="background:#1B2434">
      <img src="${foto.foto}" alt="" style="max-height:420px">
    </div>
    ${foto.titulo ? `<h3 style="margin:0 0 10px;font-size:17px;font-weight:800">${esc(foto.titulo)}</h3>` : ''}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      <span class="badge badge-info">📅 ${fmtData(foto.data)}</span>
      ${foto.idadePet ? `<span class="badge badge-purple">🐾 ${esc(foto.idadePet)}</span>` : ''}
    </div>
    ${foto.nota ? `<div class="blk"><h4><span class="b-ic">📝</span>Observação</h4><p>${esc(foto.nota)}</p></div>` : ''}`;
  openModal(headPadrao(foto.titulo || 'Foto', 'Álbum de ' + pet.nome), body,
    `<button class="btn btn-danger" onclick="confirmarExcluirFoto('${petId}','${fotoId}')" style="flex:0 0 52px;padding:13px" type="button">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
     </button>
     <button class="btn btn-soft" onclick="closeModal()">Fechar</button>
     <button class="btn btn-primary" onclick="compartilharFoto('${petId}','${fotoId}')">Compartilhar</button>`);
}

function confirmarExcluirFoto(petId, fotoId){
  openModal(headPadrao('Excluir foto', 'Não pode ser desfeito'),
    `<div style="text-align:center;padding:16px 0">
      <div style="font-size:46px;margin-bottom:12px">🗑️</div>
      <div style="font-size:14px;font-weight:800">Excluir esta foto?</div>
    </div>`,
    `<button class="btn btn-soft" onclick="abrirFotoAlbum('${petId}','${fotoId}')">Cancelar</button>
     <button class="btn btn-danger" onclick="excluirFotoAlbum('${petId}','${fotoId}')">Excluir</button>`);
}

function excluirFotoAlbum(petId, fotoId){
  const pet = state.pets.find(p => p.id === petId);
  if(!pet || !pet.album) return;
  pet.album = pet.album.filter(f => f.id !== fotoId);
  saveDB();
  closeModal();
  toast('Foto excluída');
  renderSaude();
}

function compartilharFoto(petId, fotoId){
  const pet = state.pets.find(p => p.id === petId);
  const foto = pet && pet.album && pet.album.find(f => f.id === fotoId);
  if(!foto){ toast('Foto não encontrada'); return; }
  try{
    fetch(foto.foto).then(r => r.blob()).then(blob => {
      const file = new File([blob], 'petvida-foto.jpg', {type: 'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files: [file]})){
        navigator.share({
          files: [file],
          title: foto.titulo || ('Foto de ' + pet.nome),
          text: foto.titulo || ('Foto de ' + pet.nome)
        }).catch(()=>{});
      } else if(navigator.share){
        navigator.share({
          title: foto.titulo || ('Foto de ' + pet.nome),
          text: foto.titulo ? (foto.titulo + (foto.nota ? '\n\n' + foto.nota : '')) : (foto.nota || '')
        }).catch(()=>{});
      } else {
        toast('Compartilhamento indisponível');
      }
    }).catch(()=>{
      toast('Não foi possível preparar');
    });
  }catch(e){ toast('Erro ao compartilhar'); }
}

function openModal(headHTML, bodyHTML, footHTML){
  $('#modalHead').innerHTML = headHTML;
  $('#modalBody').innerHTML = bodyHTML;
  $('#modalFoot').innerHTML = footHTML || '';
  $('#modalFoot').style.display = footHTML ? 'flex' : 'none';
  $('#modalBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#modalBody').scrollTop = 0;
}
function closeModal(){
  $('#modalBackdrop').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeModal(); });
function headPadrao(titulo, sub){
  return `<div style="flex:1"><h3>${esc(titulo)}</h3>${sub?`<p>${esc(sub)}</p>`:''}</div>
    <button class="modal-close" onclick="closeModal()" type="button">

}

  const fotoInner = formPet.foto
    ? `<img src="${formPet.foto}" alt="">`
    : `<span>${formPet.emoji}</span>`;
  const fotoHTML = `
    <input type="file" id="fileFoto" accept="image/*" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" onchange="processarFoto(this)">

  return `

  <div class="field"><label>ESPÉCIE</label>

      <button class="species-opt ${formPet.especie==='cao'?'active':''}" onclick="setFormEspecie('cao')" type="button"><span class="sp-emoji">🐶</span><span class="sp-name">Cão</span></button>

  </div>`}
  <div class="field"><label>NOME *</label><input class="input" id="fNome" value="${esc(formPet.nome)}" oninput="formPet.nome=this.value" placeholder="Ex: Rex"></div>
  <div class="field"><label>RAÇA</label>
    <select class="select" id="fRaca" onchange="formPet.raca=this.value">
      <option value="">Selecione</option>
      ${racasFiltradas.map(r=>`<option value="${esc(r.nome)}" ${formPet.raca===r.nome?'selected':''}>${esc(r.nome)}</option>`).join('')}
      <option value="Outra" ${formPet.raca==='Outra'?'selected':''}>Outra</option>
    </select>
  </div>
  <div class="row-2">
    <div class="field"><label>NASCIMENTO *</label><input class="input" type="date" id="fNasc" value="${formPet.nascimento}" max="${hojeISO()}" onchange="formPet.nascimento=this.value"></div>
    <div class="field"><label>SEXO</label>
      <select class="select" onchange="formPet.sexo=this.value">

        <option value="femea" ${formPet.sexo==='femea'?'selected':''}>Fêmea</option>
      </select>
    </div>
  </div>
  <div class="field"><label>PESO (kg)</label><input class="input" type="number" step="0.1" min="0" value="${esc(formPet.peso)}" oninput="formPet.peso=this.value" placeholder="Ex: 5.5"></div>`;

function setFormEspecie(esp){
  formPet.especie = esp;
  formPet.emoji = esp === 'gato' ? '🐈' : '🐕';
  formPet.raca = '';
  $('#modalBody').innerHTML = formPetHTML();
}
function setFormEmoji(e){
  formPet.emoji = e;
  formPet.foto = null;
  $('#modalBody').innerHTML = formPetHTML();
}

function processarFoto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 10 * 1024 * 1024){ toast('Foto muito grande (máx 10MB)'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    redimensionarImagem(e.target.result, 500, 0.82, (dataUrl) => {
      formPet.foto = dataUrl;
      const body = $('#modalBody');
      if(body) body.innerHTML = formPetHTML();
      toast('Foto adicionada! 📷');
    });
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function salvarPet(){
  const nome = ($('#fNome') ? $('#fNome').value : formPet.nome).trim();
  const nasc = $('#fNasc') ? $('#fNasc').value : formPet.nascimento;
  const raca = $('#fRaca') ? $('#fRaca').value : formPet.raca;
  if(!nome){ toast('Informe o nome'); return; }
  if(!nasc){ toast('Informe o nascimento'); return; }
  if(new Date(nasc + 'T12:00:00') > new Date()){ toast('Data no futuro'); return; }
  const pesoStr = formPet.peso ? String(formPet.peso).replace(',','.') : '';
  if(formPet.id){
    const p = state.pets.find(x=>x.id === formPet.id);
    if(!p) return;
    p.nome = nome; p.especie = formPet.especie; p.raca = raca || 'SRD';
    p.nascimento = nasc; p.sexo = formPet.sexo; p.peso = pesoStr; p.emoji = formPet.emoji; p.foto = formPet.foto;
    toast('Atualizado! ✨');
  } else {
    const pet = normalizarPet({
      id: uid(), nome, especie: formPet.especie, raca: raca || 'SRD',
      nascimento: nasc, sexo: formPet.sexo, peso: pesoStr, emoji: formPet.emoji, foto: formPet.foto,
      vacinas: {}, cuidados: [], pesos: pesoStr ? [{data: hojeISO(), valor: pesoStr}] : [],
      historico: {consultas:[],exames:[],medicamentos:[],cirurgias:[],alergias:[]},
      antipulgas: [], cio: [], diario: [], tutores: [], album: [],
      criado: new Date().toISOString()
    });
    state.pets.push(pet);
    state.petSelecionado = pet.id;
    toast('Pet cadastrado! 🎉');
  }
  saveDB(); closeModal();
  renderPage(state.currentPage); atualizarHeader();
}

function abrirModalTutor(){
  if(!state.petSelecionado){ toast('Selecione um pet'); return; }
  const parentescos = ['Tutor principal','Cônjuge','Filho(a)','Veterinário(a)','Cuidador(a)','Outro'];
  openModal(headPadrao('Tutor', 'Adicionar'),
    `<div class="field"><label>NOME *</label><input class="input" id="htNome"></div>
    <div class="field"><label>PAPEL</label>
      <select class="select" id="htParentesco">${parentescos.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>TELEFONE</label><input class="input" id="htTel" type="tel"></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarTutor()">Salvar</button>`);
}
function salvarTutor(){
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  if(!pet) return;
  const nome = $('#htNome').value.trim();
  if(!nome){ toast('Informe o nome'); return; }
  if(!pet.tutores) pet.tutores = [];
  pet.tutores.push({id:uid(), nome, parentesco:$('#htParentesco').value, telefone:$('#htTel').value.trim()});
  saveDB(); closeModal(); toast('Tutor adicionado! 👥'); renderSaude();
}
function abrirModalIDDigital(petId){
  const id = petId || state.petSelecionado;
  const pet = state.pets.find(p=>p.id === id);
  if(!pet){ toast('Pet não encontrado'); return; }
  state.petSelecionado = id;
  const codigo = gerarIdPet(pet);
  const tutor = (pet.tutores||[])[0];
  const contato = tutor ? (tutor.telefone || '—') : '—';
  const alergias = (pet.historico && pet.historico.alergias || []).map(a=>a.tipo).join(', ') || 'Nenhuma';
  openModal(headPadrao('ID Digital', 'Identificação de ' + pet.nome),
    `<div class="id-digital">
      <div class="idd-top">
        <div>
          <div class="idd-titulo">ID Digital PetVida</div>
          <div class="idd-nome" style="margin-top:6px">${esc(pet.nome)}</div>
          <div class="idd-sub">${pet.especie==='gato'?'Felino':'Canino'} · ${esc(pet.raca||'SRD')} · ${calcIdade(pet.nascimento)}</div>
        </div>
        <div class="idd-logo">🐾</div>
      </div>
      <div class="idd-grid">
        <div class="idd-item"><div class="idd-item-l">Código</div><div class="idd-item-v" style="font-family:'Courier New',monospace">${codigo}</div></div>
        <div class="idd-item"><div class="idd-item-l">Idade humana</div><div class="idd-item-v">${idadeHumana(pet)}</div></div>
        <div class="idd-item"><div class="idd-item-l">Sexo</div><div class="idd-item-v">${pet.sexo==='femea'?'Fêmea':'Macho'}</div></div>
        <div class="idd-item"><div class="idd-item-l">Peso</div><div class="idd-item-v">${pet.peso?esc(pet.peso)+' kg':'—'}</div></div>
      </div>
      <div class="idd-qr">
        <div class="idd-qr-pattern">${padraoQr(pet, 74)}</div>
        <div class="idd-qr-info">
          <div class="idd-qr-code">${codigo}</div>
          <div class="idd-qr-txt">Apresente em caso de perda ou emergência.</div>
        </div>
      </div>
      <div class="idd-footer"><span>📞 ${esc(contato)}</span><span>${fmtData(hojeISO())}</span></div>
    </div>
    <div class="blk warn"><h4><span class="b-ic">⚠️</span>Alergias</h4><p>${esc(alergias)}</p></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Fechar</button>
     <button class="btn btn-primary" onclick="compartilharID('${pet.id}')">Compartilhar</button>`);
}
function compartilharID(petId){
  const pet = state.pets.find(p=>p.id === petId);
  if(!pet) return;
  const codigo = gerarIdPet(pet);
  const texto = `🐾 ID DIGITAL - ${pet.nome}\n\nCódigo: ${codigo}\nIdade: ${calcIdade(pet.nascimento)}\nPeso: ${pet.peso?pet.peso+' kg':'—'}`;
  if(navigator.share) navigator.share({title:'ID - ' + pet.nome, text: texto}).catch(()=>{});
  else if(navigator.clipboard) navigator.clipboard.writeText(texto).then(()=> toast('Copiado! 📋')).catch(()=>{});
  else toast('Indisponível');
}
const ESCORES = [
  {n:1, emoji:'🦴', label:'Muito magro', desc:'Costelas muito visíveis.'},
  {n:2, emoji:'🐕', label:'Magro', desc:'Costelas visíveis.'},
  {n:3, emoji:'✅', label:'Ideal', desc:'Costelas palpáveis, cintura visível.'},
  {n:4, emoji:'⚠️', label:'Sobrepeso', desc:'Costelas difíceis.'},
  {n:5, emoji:'🚨', label:'Obeso', desc:'Costelas não palpáveis.'}
];
let escoreSelecionado = 3;
function abrirModalEscore(petId){
  const id = petId || state.petSelecionado;
  const pet = state.pets.find(p=>p.id === id);
  if(!pet){ toast('Pet não encontrado'); return; }
  state.petSelecionado = id;
  const atual = pet.escore || 3;
  escoreSelecionado = atual;
  openModal(headPadrao('Escore corporal', 'Avalie a condição'),
    `<div class="escore-scale">
      ${ESCORES.map(e=>`<div class="escore-opt ${e.n===atual?'active':''}" data-n="${e.n}" onclick="selEscore(${e.n})"><span class="eo-emoji">${e.emoji}</span><span class="eo-num">${e.n}</span></div>`).join('')}
    </div>
    <div id="escoreInfo"></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Fechar</button>
     <button class="btn btn-primary" onclick="salvarEscore()">Salvar</button>`);
  setTimeout(()=> atualizarEscoreInfo(atual), 50);
}
function selEscore(n){ escoreSelecionado = n; $$('.escore-opt').forEach(o => o.classList.toggle('active', +o.dataset.n === n)); atualizarEscoreInfo(n); }
function atualizarEscoreInfo(n){
  const e = ESCORES.find(x=>x.n === n);
  if(!e) return;
  const info = $('#escoreInfo');
  if(info) info.innerHTML = `<div class="blk"><h4>${e.emoji} ${e.label}</h4><p>${esc(e.desc)}</p></div>`;
}
function salvarEscore(){
  const pet = state.pets.find(p=>p.id === state.petSelecionado);
  if(!pet) return;
  pet.escore = escoreSelecionado;
  saveDB(); closeModal(); toast('Escore salvo! ⚖️'); renderSaude();
}
function abrirModalAjuda(){
  openModal(headPadrao('Como usar o PetVida', 'Guia rápido'),
    `<div class="blk" style="background:linear-gradient(140deg,#F3EAFE,#E9DDFB);border-color:#D9C4F5">
      <h4><span class="b-ic" style="background:rgba(155,93,229,.20);color:#6B31B8">🤖</span>Dr. Pet IA + 🌐 Web</h4>
      <p>O Dr. Pet IA usa <strong>Gemini com pesquisa na internet</strong>. Pergunte qualquer coisa — ele busca dados atualizados e mostra as fontes consultadas. Toque em <strong>⚙️</strong> no chat para configurar.</p>
    </div>
    <div class="blk" style="background:linear-gradient(140deg,#FFF0E8,#FFE3D4);border-color:#FFD3BC">
      <h4><span class="b-ic" style="background:rgba(255,122,69,.20);color:#F05A1E">📸</span>Álbum de Fotos</h4>
      <p>Acesse <strong>Saúde → 📸 Álbum</strong> e registre a evolução do seu pet. Cada foto salva a idade dele no momento, organizada por mês.</p>
    </div>
    <div class="blk"><h4><span class="b-ic">👆</span>Navegação</h4><p>Deslize o dedo para trocar de página.</p></div>
    <div class="blk"><h4><span class="b-ic">💾</span>Backup</h4><p>Exporte/importe dados no ícone no topo.</p></div>
    <div class="blk warn"><h4><span class="b-ic">⚕️</span>Aviso</h4><p>Não substitui consulta veterinária.</p></div>
    <div style="text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:10px 0">PetVida <strong style="color:var(--primary-d)">${APP_VERSION}</strong> · ${APP_VERSION_DATE}</div>`,
    `<button class="btn btn-primary" onclick="closeModal()">Entendi</button>`);
}

/* ============================================================
   INICIALIZAÇÃO
============================================================ */
function init(){
  loadDB();
  loadIAConfig();
  loadChatHistory();
  if(state.pets.length > 0) state.petSelecionado = state.pets[0].id;
  if(state.pets.length > 0 && getBackups().length === 0) fazerBackupAutomatico('Inicial');
  $$('.page').forEach((p, idx) => p.classList.toggle('active', idx === 0));
  goTo(0);
  atualizarHeader();
  atualizarFAB();
  atualizarBadgeBackup();
  console.log(`🐾 PetVida ${APP_VERSION} (${APP_VERSION_DATE}) iniciado`);
  console.log('🤖 IA:', iaConfig.provider, '· modelo:', iaConfig.model || '(autodetecção)');
  console.log('🌐 Pesquisa na internet: ativada');
  console.log('🔑 Chave:', (iaConfig.apiKey || '').slice(0, 25) + '...');
}
init();

let lastTouch = 0;
document.addEventListener('touchend', e=>{
  const now = Date.now();
  if(now <= lastTouch + 300 && !e.target.closest('.chat-input') && !e.target.closest('input') && !e.target.closest('textarea') && !e.target.closest('label')) e.preventDefault();
  lastTouch = now;
}, {passive:false});
window.addEventListener('beforeunload', saveDB);

setInterval(()=>{
  if(state.pets.length > 0) fazerBackupAutomatico('Automático');
}, 30 * 60 * 1000);
</script>
</body>
</html>
