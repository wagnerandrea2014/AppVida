<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FF7A45" />
<title>PetVida — Cuide bem do seu melhor amigo</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
input,select,textarea{outline:none}
ul{margin:0;padding:0;list-style:none}
:root{
  --bg:#F4F6FB;--card:#FFFFFF;--txt:#1B2434;--muted:#7B879C;--line:#EAEEF6;
  --primary:#FF7A45;--primary-d:#F05A1E;--primary-soft:#FFF0E8;
  --secondary:#25C2B0;--secondary-soft:#E4F8F5;
  --accent:#FFB020;--accent-soft:#FFF6E2;
  --danger:#EF476F;--danger-soft:#FFE9EF;
  --blue:#4A7DFF;--blue-soft:#EAF0FF;
  --purple:#9B5DE5;--purple-soft:#F3EAFE;
  --radius:20px;--radius-sm:14px;
  --shadow:0 6px 22px rgba(27,36,52,.07);
  --shadow-lg:0 14px 40px rgba(27,36,52,.16);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --tab-h: 68px;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.app-header{position:relative;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px;background:linear-gradient(140deg,#FF8A5B 0%,#FF6B35 55%,#F0521B 100%);color:#fff;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(240,90,30,.28);flex-shrink:0}
.app-header::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.10)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;backdrop-filter:blur(6px)}
.hdr-logo svg{width:22px;height:22px;fill:#fff}
.hdr-title{font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.1;display:flex;align-items:center;gap:6px}
.hdr-version{font-size:9.5px;font-weight:800;background:rgba(255,255,255,.25);padding:2.5px 6px;border-radius:6px;letter-spacing:.3px}
.hdr-sub{font-size:11.5px;opacity:.85;font-weight:500}
.hdr-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.20);display:grid;place-items:center;backdrop-filter:blur(6px);transition:transform .15s ease;position:relative;cursor:pointer}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.32)}
.icon-btn svg{width:19px;height:19px;fill:#fff}
.icon-btn .badge-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#25C2B0;border:2px solid rgba(255,255,255,.9)}
.hdr-stats{display:flex;gap:9px;margin-top:14px;position:relative;z-index:2}
.stat{flex:1;background:rgba(255,255,255,.17);border-radius:14px;padding:9px 10px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16)}
.stat-n{font-size:17px;font-weight:800;line-height:1}
.stat-l{font-size:10px;opacity:.88;margin-top:3px;font-weight:600;letter-spacing:.2px}
.swiper{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--tab-h) + var(--safe-b) + 26px);scrollbar-width:none;display:none}
.page.active{display:block;animation:pageSlide .3s cubic-bezier(.32,.72,.28,1)}
.page.chat-page{padding:0 0 calc(var(--tab-h) + var(--safe-b))}
@keyframes pageSlide{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
.page::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;align-items:stretch;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(27,36,52,.06)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9AA6B8;position:relative;transition:color .2s ease;padding-top:6px;cursor:pointer}
.tab svg{width:18px;height:18px;fill:currentColor;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.tab span{font-size:8.5px;font-weight:700;letter-spacing:.1px}
.tab.active{color:var(--primary)}
.tab.active svg{transform:translateY(-2px) scale(1.1)}
.tab.active::after{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}
.tab.ia-tab.active{color:#9B5DE5}
.tab.ia-tab.active::after{background:#9B5DE5}
.tab.ia-tab .ia-dot{position:absolute;top:8px;right:calc(50% - 14px);width:6px;height:6px;border-radius:50%;background:#9B5DE5;animation:pulse2 2s infinite}
@keyframes pulse2{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.2)}}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}
.sec-head:first-child{margin-top:2px}
.sec-title{font-size:15.5px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.sec-title .dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.sec-link{font-size:12px;font-weight:700;color:var(--primary);padding:4px 0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;border:1px solid rgba(234,238,246,.9)}
.empty-hero{background:linear-gradient(140deg,#FFFFFF,#FFF7F2);border:1.5px dashed #FFD3BC;border-radius:var(--radius);padding:26px 20px;text-align:center;box-shadow:var(--shadow)}
.empty-emoji{font-size:44px;line-height:1;margin-bottom:10px;display:block}
.empty-hero h3{margin:0 0 6px;font-size:16px;font-weight:800}
.empty-hero p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:800;transition:transform .13s ease;width:100%;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#FF8A5B,#F0521B);color:#fff;box-shadow:0 8px 20px rgba(240,90,30,.30)}
.btn-ghost{background:var(--primary-soft);color:var(--primary-d)}
.btn-soft{background:#F1F4F9;color:var(--txt)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-purple{background:linear-gradient(135deg,#9B5DE5,#B585F0);color:#fff;box-shadow:0 8px 20px rgba(155,93,229,.30)}
.btn-success{background:linear-gradient(135deg,#25C2B0,#4AD4C3);color:#fff;box-shadow:0 8px 20px rgba(37,194,176,.30)}
.btn-sm{padding:10px 15px;font-size:12.5px;width:auto;border-radius:12px}
.btn svg{width:17px;height:17px;fill:currentColor}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pet-card{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow);margin-bottom:11px;border:1px solid rgba(234,238,246,.9);transition:transform .14s ease;position:relative;overflow:hidden;cursor:pointer}
.pet-card:active{transform:scale(.985)}
.pet-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--primary),var(--accent))}
.pet-avatar{width:54px;height:54px;border-radius:17px;flex-shrink:0;display:grid;place-items:center;font-size:27px;background:linear-gradient(140deg,#FFE3D4,#FFD0BB);box-shadow:inset 0 -2px 6px rgba(240,90,30,.10);overflow:hidden}
.pet-avatar.cat{background:linear-gradient(140deg,#DDF6F2,#C6EFE9)}
.pet-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.pet-info{flex:1;min-width:0}
.pet-name{font-size:15px;font-weight:800;letter-spacing:-.2px}
.pet-meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet-badges{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.badge{font-size:9.5px;font-weight:800;padding:3.5px 8px;border-radius:8px;letter-spacing:.2px;text-transform:uppercase}
.badge-ok{background:var(--secondary-soft);color:#12897A}
.badge-warn{background:var(--accent-soft);color:#B47800}
.badge-late{background:var(--danger-soft);color:#C42B50}
.badge-info{background:var(--blue-soft);color:#3157C9}
.badge-purple{background:var(--purple-soft);color:#6B31B8}
.badge-neutro{background:#F1F4F9;color:#66738A}
.pet-chevron{color:#C7CFDD;flex-shrink:0}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);width:56px;height:56px;border-radius:19px;z-index:35;background:linear-gradient(135deg,#FF8A5B,#F0521B);display:grid;place-items:center;box-shadow:0 12px 28px rgba(240,90,30,.42);cursor:pointer}
.fab svg{width:26px;height:26px;fill:#fff}
.next-card{background:linear-gradient(140deg,#FFFFFF,#FFF6F0);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid #FFE3D4;display:flex;gap:13px;align-items:flex-start;cursor:pointer}
.next-card.alerta{background:linear-gradient(140deg,#FFFFFF,#FFF0F4);border-color:#FFD5E0}
.next-icon{width:46px;height:46px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;background:var(--primary-soft);font-size:21px}
.next-card.alerta .next-icon{background:var(--danger-soft)}
.next-body{flex:1;min-width:0}
.next-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--primary-d)}
.next-card.alerta .next-label{color:var(--danger)}
.next-title{font-size:14.5px;font-weight:800;margin-top:3px;letter-spacing:-.2px}
.next-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.next-date{font-size:11px;font-weight:800;margin-top:7px;color:var(--primary-d)}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.quick{background:var(--card);border-radius:var(--radius-sm);padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);cursor:pointer}
.quick:active{transform:scale(.94)}
.quick-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.quick span{font-size:9.5px;font-weight:800;color:#4C5768;text-align:center;line-height:1.2}
.tip-card{background:linear-gradient(135deg,#1F2A3D,#2B3A52);border-radius:var(--radius);padding:17px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tip-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:8px;margin-bottom:9px}
.tip-card h4{margin:0 0 6px;font-size:14.5px;font-weight:800}
.tip-card p{margin:0;font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.82)}
.search-wrap{position:relative;margin-bottom:13px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:#A9B3C4}
.search-input{width:100%;padding:13px 14px 13px 41px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
.search-input:focus{border-color:var(--primary)}
.seg{display:flex;gap:5px;background:#E9EDF5;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 8px;border-radius:11px;font-size:12.5px;font-weight:800;color:#7B879C;cursor:pointer}
.seg button.active{background:#fff;color:var(--primary-d);box-shadow:0 3px 10px rgba(27,36,52,.10)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:13px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:11px;font-size:12px;font-weight:700;background:var(--card);border:1.5px solid var(--line);color:#66738A;cursor:pointer}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(255,122,69,.32)}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:10px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav-btn{flex-shrink:0;padding:9px 14px;border-radius:12px;font-size:11.5px;font-weight:800;background:#fff;border:1.5px solid var(--line);color:#66738A;display:flex;align-items:center;gap:5px;cursor:pointer}
.subnav-btn.active{background:linear-gradient(135deg,#FF8A5B,#F0521B);border-color:transparent;color:#fff}
.breed-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.breed-card{background:var(--card);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);text-align:left;cursor:pointer}
.breed-top{height:110px;display:grid;place-items:center;position:relative;overflow:hidden}
.breed-top svg.raca-svg{width:100%;height:100%;display:block}
.breed-top .breed-emoji-badge{position:absolute;top:8px;left:8px;font-size:14px;background:rgba(255,255,255,.92);width:26px;height:26px;border-radius:9px;display:grid;place-items:center;z-index:2}
.breed-porte{position:absolute;top:8px;right:8px;font-size:8.5px;font-weight:800;background:rgba(255,255,255,.92);color:#5A6478;padding:3px 7px;border-radius:7px;text-transform:uppercase;z-index:2}
.breed-body{padding:10px 11px 12px}
.breed-name{font-size:12.5px;font-weight:800;line-height:1.25}
.breed-sub{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
.timeline{position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:14px;width:2px;background:linear-gradient(180deg,#FFD3BC,#E9EDF5);border-radius:2px}
.tl-item{position:relative;margin-bottom:13px}
.tl-node{position:absolute;left:-30px;top:14px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #D8DFEA;display:grid;place-items:center}
.tl-node svg{width:11px;height:11px;fill:#fff;opacity:0}
.tl-item.ok .tl-node{background:var(--secondary);border-color:var(--secondary)}
.tl-item.ok .tl-node svg{opacity:1}
.tl-item.atrasada .tl-node{background:var(--danger);border-color:var(--danger)}
.tl-item.proxima .tl-node{border-color:var(--accent);background:var(--accent-soft)}
.vac-card{background:var(--card);border-radius:var(--radius-sm);padding:13px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.tl-item.ok .vac-card{border-color:#D3F0EB;background:linear-gradient(140deg,#fff,#F6FDFB)}
.tl-item.atrasada .vac-card{border-color:#FFD5E0;background:linear-gradient(140deg,#fff,#FFF7F9)}
.vac-head{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
.vac-name{font-size:13.5px;font-weight:800;line-height:1.3}
.vac-obs{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.vac-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.vac-date{font-size:11px;font-weight:800;color:#5A6478}
.vac-marca{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;background:var(--purple-soft);color:#6B31B8;padding:4px 8px;border-radius:7px;margin-top:6px}
.check-btn{width:30px;height:30px;border-radius:10px;flex-shrink:0;border:2px solid #D8DFEA;display:grid;place-items:center;cursor:pointer}
.check-btn svg{width:15px;height:15px;fill:#fff;opacity:0}
.check-btn.done{background:var(--secondary);border-color:var(--secondary)}
.check-btn.done svg{opacity:1}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:13px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:9px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);cursor:pointer}
.check-item.done{background:linear-gradient(140deg,#fff,#F6FDFB);border-color:#D3F0EB}
.check-box{width:23px;height:23px;border-radius:8px;flex-shrink:0;margin-top:1px;border:2px solid #D8DFEA;display:grid;place-items:center}
.check-box svg{width:13px;height:13px;fill:#fff;opacity:0}
.check-item.done .check-box{background:var(--secondary);border-color:var(--secondary)}
.check-item.done .check-box svg{opacity:1}
.check-txt{flex:1}
.check-txt h5{margin:0;font-size:13px;font-weight:800}
.check-item.done .check-txt h5{color:#7B879C;text-decoration:line-through}
.check-txt p{margin:4px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding:12px 4px 0;margin-bottom:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#FFA277,#FF7A45);min-height:6px}
.bar-lbl{font-size:9.5px;font-weight:800;color:var(--muted)}
.bar-val{font-size:10px;font-weight:800;color:var(--primary-d)}
.food-card{background:var(--card);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);margin-bottom:11px;border:1px solid rgba(234,238,246,.9)}
.food-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.food-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft);flex-shrink:0}
.food-head h4{margin:0;font-size:14px;font-weight:800}
.food-head p{margin:3px 0 0;font-size:11px;color:var(--muted);font-weight:600}
.food-list li{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5;color:#4C5768}
.food-list li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:7px}
.food-brand{display:inline-block;font-size:10.5px;font-weight:800;color:var(--primary-d);background:var(--primary-soft);padding:4px 9px;border-radius:8px;margin:4px 5px 0 0}
.empty{text-align:center;padding:42px 24px;color:var(--muted)}
.empty .e-ic{font-size:42px;display:block;margin-bottom:12px;opacity:.75}
.empty h4{margin:0 0 6px;font-size:14.5px;font-weight:800;color:var(--txt)}
.empty p{margin:0;font-size:12.5px;line-height:1.6}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(19,25,38,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .26s ease;display:flex;align-items:flex-end}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-height:92vh;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,.28,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-backdrop.open .modal{transform:translateY(0)}
.modal-grab{padding:9px 0 4px;display:flex;justify-content:center;flex-shrink:0}
.modal-grab::after{content:"";width:38px;height:4.5px;border-radius:3px;background:#D5DCE8}
.modal-head{padding:6px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.modal-head h3{margin:0;font-size:18px;font-weight:800}
.modal-head p{margin:3px 0 0;font-size:12px;color:var(--muted);font-weight:600}
.modal-close{width:34px;height:34px;border-radius:12px;background:#EAEEF6;display:grid;place-items:center;flex-shrink:0;cursor:pointer}
.modal-close svg{width:16px;height:16px;fill:#66738A}
.modal-body{flex:1;overflow-y:auto;padding:0 20px 20px;-webkit-overflow-scrolling:touch}
.modal-foot{padding:13px 20px calc(20px + var(--safe-b));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;flex-shrink:0}
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:800;color:#5A6478;margin-bottom:7px}
.field .hint{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:6px;line-height:1.5}
.input,.select,.textarea{width:100%;padding:13px 14px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:600}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3.5px rgba(255,122,69,.11)}
.textarea{min-height:80px;resize:vertical;font-family:inherit;line-height:1.5}
.select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237B879C'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 11px center;background-size:20px;padding-right:38px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.species-pick{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.species-opt{border:2px solid var(--line);border-radius:16px;padding:15px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;background:#fff;cursor:pointer}
.species-opt .sp-emoji{font-size:27px}
.species-opt .sp-name{font-size:12px;font-weight:800;color:#66738A}
.species-opt.active{border-color:var(--primary);background:var(--primary-soft)}
.species-opt.active .sp-name{color:var(--primary-d)}
.avatar-pick{display:flex;gap:9px;flex-wrap:wrap}
.avatar-opt{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:#F1F4F9;border:2px solid transparent;cursor:pointer}
.avatar-opt.active{border-color:var(--primary);background:var(--primary-soft)}
.breed-hero{border-radius:22px;padding:22px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.breed-hero-svg{width:140px;height:140px;margin:0 auto 10px;position:relative;z-index:2;border-radius:26px;overflow:hidden}
.breed-hero h2{margin:8px 0 3px;font-size:20px;font-weight:800}
.breed-hero .bh-origem{font-size:11.5px;font-weight:700;color:#8A6A55}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.spec{background:#fff;border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.spec-l{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.spec-v{font-size:13px;font-weight:800;margin-top:4px;color:var(--txt)}
.tag-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.tag{font-size:11px;font-weight:800;padding:6px 11px;border-radius:10px;background:var(--primary-soft);color:var(--primary-d)}
.blk{background:#fff;border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.blk h4{margin:0 0 10px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.blk h4 .b-ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;background:var(--primary-soft);flex-shrink:0}
.blk p{margin:0;font-size:12.5px;line-height:1.65;color:#4C5768}
.blk ul li{display:flex;gap:9px;padding:7px 0;font-size:12.5px;line-height:1.55;color:#4C5768}
.blk ul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:6px}
.blk.warn h4 .b-ic{background:var(--danger-soft)}
.blk.warn ul li::before{background:var(--danger)}
.blk.purple h4 .b-ic{background:var(--purple-soft);color:#6B31B8}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 24px);transform:translate(-50%,26px);z-index:200;background:#1F2A3D;color:#fff;padding:12px 20px;border-radius:14px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.32,.72,.28,1);max-width:86vw;text-align:center;line-height:1.4}
.toast.show{opacity:1;transform:translate(-50%,0)}
.up{position:fixed;right:18px;bottom:calc(var(--tab-h) + var(--safe-b) + 82px);width:42px;height:42px;border-radius:14px;background:#fff;z-index:34;display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s ease;border:1px solid var(--line);cursor:pointer}
.up.show{opacity:1;pointer-events:auto}
.up svg{width:17px;height:17px;fill:var(--primary)}
.anim{animation:fadeUp .38s cubic-bezier(.32,.72,.28,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.carteira{background:linear-gradient(180deg,#FFFFFF 0%,#FFFCF8 100%);border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(27,36,52,.10);border:2px solid #FFE3D4;margin-bottom:16px}
.carteira-header{background:linear-gradient(135deg,#FF7A45,#F0521B);padding:18px;color:#fff;position:relative;overflow:hidden}
.carteira-header .ch-titulo{font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.85;position:relative;z-index:2}
.carteira-header h3{margin:4px 0 0;font-size:19px;font-weight:800;position:relative;z-index:2}
.carteira-header .ch-brasil{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:16px;z-index:2}
.carteira-pet{padding:16px 18px;display:flex;align-items:center;gap:13px;border-bottom:2px dashed #FFE3D4}
.carteira-pet .cp-avatar{width:60px;height:60px;border-radius:18px;flex-shrink:0;display:grid;place-items:center;font-size:30px;background:linear-gradient(140deg,#FFE3D4,#FFD0BB);border:2px solid #fff;overflow:hidden}
.carteira-pet .cp-avatar img{width:100%;height:100%;object-fit:cover}
.carteira-pet .cp-info{flex:1;min-width:0}
.carteira-pet .cp-nome{font-size:17px;font-weight:800;color:#1B2434}
.carteira-pet .cp-sub{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
.carteira-pet .cp-linha{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.carteira-pet .cp-chip{font-size:9px;font-weight:800;padding:3px 7px;border-radius:6px;background:#F1F4F9;color:#66738A;text-transform:uppercase}
.carteira-info{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;border-bottom:2px dashed #FFE3D4}
.carteira-info .ci-item{display:flex;flex-direction:column;gap:3px}
.carteira-info .ci-label{font-size:8.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.carteira-info .ci-valor{font-size:12.5px;font-weight:800;color:#1B2434}
.carteira-secao{padding:14px 18px 4px}
.carteira-secao .cs-titulo{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--primary-d);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.carteira-secao .cs-count{font-size:9px;background:var(--primary-soft);color:var(--primary-d);padding:3px 7px;border-radius:6px}
.carteira-vac{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid #F4F6FB}
.carteira-vac .cv-num{width:26px;height:26px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;font-size:10px;font-weight:800;background:#F1F4F9;color:#66738A;margin-top:1px}
.carteira-vac.aplicada .cv-num{background:var(--secondary);color:#fff}
.carteira-vac.pendente .cv-num{background:var(--accent);color:#fff}
.carteira-vac.atrasada .cv-num{background:var(--danger);color:#fff}
.carteira-vac .cv-body{flex:1;min-width:0}
.carteira-vac .cv-nome{font-size:12.5px;font-weight:800;color:#1B2434}
.carteira-vac .cv-data{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:3px}
.carteira-vac .cv-marca{font-size:9.5px;font-weight:800;background:var(--purple-soft);color:#6B31B8;padding:3px 7px;border-radius:6px;margin-top:5px;display:inline-block}
.carteira-vac .cv-status{font-size:8.5px;font-weight:800;padding:3px 7px;border-radius:6px;text-transform:uppercase;flex-shrink:0}
.carteira-vac.aplicada .cv-status{background:var(--secondary-soft);color:#12897A}
.carteira-vac.pendente .cv-status{background:var(--accent-soft);color:#B47800}
.carteira-vac.atrasada .cv-status{background:var(--danger-soft);color:#C42B50}
.carteira-assinatura{padding:16px 18px;background:#FBFCFE;display:flex;flex-direction:column;gap:14px}
.carteira-assinatura .ca-txt{font-size:8.5px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:22px}
.carteira-assinatura .ca-trace{border-bottom:1.5px dashed #C7CFDD;padding-bottom:4px;font-size:9px;color:#A9B3C4;text-align:center}
.carteira-rodape{padding:11px 18px;background:linear-gradient(135deg,#FFF6F0,#FFF0E8);border-top:1px solid #FFE3D4;display:flex;align-items:center;justify-content:space-between;font-size:9px;font-weight:800;color:var(--primary-d);text-transform:uppercase}
.carteira-rodape .cr-app{display:flex;align-items:center;gap:6px}
.carteira-rodape .cr-logo{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,#FF7A45,#F0521B);display:grid;place-items:center;font-size:9px}
.carteira-alerta{background:linear-gradient(140deg,#FFF6F0,#FFF0E8);border:1.5px solid #FFE3D4;border-radius:14px;padding:11px 13px;font-size:11px;line-height:1.55;color:#8A6A55;font-weight:600;margin-bottom:14px;display:flex;gap:9px}
.foto-upload-wrap{position:relative;width:130px;margin:0 auto 14px}
.foto-upload{position:relative;display:grid;place-items:center;width:130px;height:130px;border-radius:36px;background:linear-gradient(140deg,#FFE3D4,#FFD0BB);font-size:60px;border:3px solid #fff;box-shadow:0 8px 20px rgba(240,90,30,.18);cursor:pointer;overflow:hidden;transition:transform .15s ease}
.foto-upload:active{transform:scale(.96)}
.foto-upload img{width:100%;height:100%;object-fit:cover;display:block}
.foto-upload .foto-edit{position:absolute;bottom:-2px;right:-2px;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#FF8A5B,#F0521B);display:grid;place-items:center;border:3px solid #fff;pointer-events:none;box-shadow:0 4px 12px rgba(240,90,30,.35)}
.foto-upload .foto-edit svg{width:16px;height:16px;fill:#fff}
.foto-hint{text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:-8px;margin-bottom:14px}
.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.album-item{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1;background:#F1F4F9;cursor:pointer;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);transition:transform .15s ease}
.album-item:active{transform:scale(.95)}
.album-item img{width:100%;height:100%;object-fit:cover;display:block}
.album-info{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;padding:18px 6px 5px}
.album-titulo{font-size:9.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-data{font-size:8.5px;opacity:.85;font-weight:600;margin-top:1px}
.album-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.album-stat{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);text-align:center}
.album-stat-n{font-size:20px;font-weight:800;color:var(--primary-d);line-height:1}
.album-stat-l{font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-top:4px;letter-spacing:.4px}
.album-upload-empty{text-align:center;padding:26px 18px}
.album-preview{position:relative;border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);background:#1B2434}
.album-preview img{width:100%;display:block;max-height:340px;object-fit:contain;margin:0 auto}
.album-timeline{display:flex;flex-direction:column;gap:14px}
.album-tl-group{position:relative;padding-left:26px}
.album-tl-group::before{content:"";position:absolute;left:8px;top:8px;bottom:-8px;width:2px;background:linear-gradient(180deg,#FFD3BC,#E9EDF5)}
.album-tl-dot{position:absolute;left:0;top:4px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#FF8A5B,#F0521B);border:3px solid #fff;box-shadow:0 2px 8px rgba(240,90,30,.30)}
.album-tl-label{font-size:11px;font-weight:800;color:var(--primary-d);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.album-tl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.album-tl-grid .album-item{border-radius:11px}
.id-digital{background:linear-gradient(160deg,#1F2A3D,#2B3A52);border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(19,25,38,.30);margin-bottom:16px}
.id-digital .idd-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;margin-bottom:14px}
.id-digital .idd-titulo{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.60)}
.id-digital .idd-logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#FF7A45,#F0521B);display:grid;place-items:center;font-size:16px}
.id-digital .idd-nome{font-size:22px;font-weight:800;color:#fff;position:relative;z-index:2;margin-bottom:4px}
.id-digital .idd-sub{font-size:11.5px;color:rgba(255,255,255,.65);font-weight:600;position:relative;z-index:2;margin-bottom:16px}
.id-digital .idd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:2;margin-bottom:16px}
.id-digital .idd-item{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.id-digital .idd-item-l{font-size:8.5px;font-weight:800;text-transform:uppercase;color:rgba(255,255,255,.50)}
.id-digital .idd-item-v{font-size:13px;font-weight:800;margin-top:3px;color:#fff}
.id-digital .idd-qr{position:relative;z-index:2;background:#fff;padding:12px;border-radius:14px;display:flex;align-items:center;gap:12px;color:#1B2434}
.id-digital .idd-qr-pattern{width:74px;height:74px;flex-shrink:0;border-radius:8px;background:#1B2434;display:grid;place-items:center;padding:4px}
.id-digital .idd-qr-code{font-size:14px;font-weight:800;color:#1B2434;font-family:'Courier New',monospace}
.id-digital .idd-qr-txt{font-size:9.5px;color:#66738A;font-weight:600;margin-top:3px}
.id-digital .idd-footer{position:relative;z-index:2;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.15);font-size:9.5px;color:rgba(255,255,255,.55);font-weight:600;display:flex;justify-content:space-between}
.hist-card{background:#fff;border-radius:var(--radius-sm);padding:13px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);margin-bottom:9px;position:relative;display:flex;gap:11px}
.hist-card .hc-icon{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:17px}
.hist-card .hc-body{flex:1;min-width:0}
.hist-card .hc-title{font-size:13.5px;font-weight:800;line-height:1.3}
.hist-card .hc-sub{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.hist-card .hc-del{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:9px;background:#F8FAFD;display:grid;place-items:center;color:#C7CFDD;cursor:pointer}
.hist-card .hc-del svg{width:13px;height:13px;fill:currentColor}
.hist-card.tipo-consulta .hc-icon{background:var(--blue-soft);color:#3157C9}
.hist-card.tipo-exame .hc-icon{background:var(--purple-soft);color:#6B31B8}
.hist-card.tipo-medicamento .hc-icon{background:var(--accent-soft);color:#B47800}
.hist-card.tipo-cirurgia .hc-icon{background:var(--danger-soft);color:#C42B50}
.hist-card.tipo-alergia .hc-icon{background:var(--secondary-soft);color:#12897A}
.hist-card.tipo-antipulgas .hc-icon{background:#FFE9DC;color:#F05A1E}
.escore-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.escore-opt{padding:9px 4px;border-radius:12px;text-align:center;background:#F1F4F9;border:2px solid transparent;cursor:pointer}
.escore-opt.active{border-color:var(--primary);background:var(--primary-soft)}
.escore-opt .eo-emoji{font-size:22px;display:block;margin-bottom:4px}
.escore-opt .eo-num{font-size:10px;font-weight:800;color:#66738A}
.diario-item{background:#fff;border-radius:var(--radius-sm);padding:13px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);margin-bottom:9px}
.diario-item .di-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.diario-item .di-humor{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#1B2434}
.diario-item .di-humor .di-emoji{font-size:20px}
.diario-item .di-data{font-size:10.5px;font-weight:800;color:var(--muted)}
.diario-item .di-nota{font-size:12.5px;color:#4C5768;line-height:1.55;margin:0}
.humor-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:14px}
.humor-opt{padding:11px 4px;border-radius:14px;text-align:center;background:#F1F4F9;border:2px solid transparent;cursor:pointer}
.humor-opt.active{border-color:var(--primary);background:var(--primary-soft)}
.humor-opt .ho-emoji{font-size:22px;display:block;margin-bottom:4px}
.humor-opt .ho-lbl{font-size:9px;font-weight:800;color:#66738A;text-transform:uppercase}
.tutor-card{background:#fff;border-radius:var(--radius-sm);padding:13px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);margin-bottom:9px;display:flex;align-items:center;gap:12px}
.tutor-card .tc-avatar{width:46px;height:46px;border-radius:15px;background:linear-gradient(140deg,#FFE3D4,#FFD0BB);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.tutor-card .tc-nome{font-size:14px;font-weight:800}
.tutor-card .tc-role{font-size:10.5px;font-weight:800;color:var(--primary-d);text-transform:uppercase;margin-top:2px}
.tutor-card .tc-contato{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px}
.ps-list{display:flex;flex-direction:column;gap:10px}
.ps-item{background:#fff;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9)}
.ps-head{padding:14px;display:flex;align-items:center;gap:11px;cursor:pointer}
.ps-head .ps-emoji{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--danger-soft);flex-shrink:0}
.ps-head .ps-title{flex:1;font-size:13.5px;font-weight:800}
.ps-head .ps-arrow{width:18px;height:18px;fill:#C7CFDD;transition:transform .25s ease}
.ps-item.open .ps-arrow{transform:rotate(180deg)}
.ps-body{padding:0 14px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease}
.ps-item.open .ps-body{max-height:1400px;padding:0 14px 16px}
.ps-body h5{font-size:11.5px;font-weight:800;color:var(--primary-d);text-transform:uppercase;margin:12px 0 6px}
.ps-body ul li{font-size:12.5px;color:#4C5768;padding:4px 0 4px 16px;position:relative;line-height:1.5}
.ps-body ul li::before{content:"•";position:absolute;left:4px;color:var(--primary);font-weight:800}
.ps-body .ps-warn{background:var(--danger-soft);border-radius:10px;padding:10px 12px;font-size:11.5px;font-weight:700;color:#C42B50;line-height:1.5;margin-top:10px}
.alim-cat{margin-bottom:16px}
.alim-cat h4{font-size:12.5px;font-weight:800;text-transform:uppercase;color:var(--primary-d);margin:0 0 9px}
.alim-item{background:#fff;border-radius:12px;padding:11px 13px;box-shadow:var(--shadow);border:1px solid rgba(234,238,246,.9);margin-bottom:7px;display:flex;gap:10px}
.alim-item .ai-icon{font-size:18px;flex-shrink:0}
.alim-item .ai-nome{font-size:12.5px;font-weight:800;color:#1B2434}
.alim-item .ai-nota{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.alim-item.permitido{border-left:3px solid var(--secondary)}
.alim-item.perigoso{border-left:3px solid var(--accent)}
.alim-item.toxico{border-left:3px solid var(--danger)}
.marca-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.marca-chip{padding:7px 12px;border-radius:10px;font-size:11.5px;font-weight:800;background:#F1F4F9;color:#5A6478;border:2px solid transparent;cursor:pointer}
.marca-chip.active{background:var(--purple-soft);border-color:var(--purple);color:#6B31B8}

<script>
/* ============================================================
   CONFIGURAÇÃO — IA GEMINI (USO PESSOAL, SEM RESTRIÇÕES)
============================================================ */
const APP_VERSION = 'v9.2';
const APP_VERSION_DATE = '2025-01-16';

const IA_CONFIG_KEY = 'petvida_ia_config_v5';
const DB_KEY = 'petvida_v9';
const BACKUP_KEY = 'petvida_backups';
const CHAT_HISTORY_KEY = 'petvida_chat_history';
const MAX_AUTO_BACKUPS = 5;

const GEMINI_API_KEY_PADRAO = 'AQ.Ab8RN6KvN127QdAWcwXuH2i32b0n1OMUoDjPwsM3dHufUN45WQ';

let iaConfig = {
  provider: 'gemini',
  apiKey: GEMINI_API_KEY_PADRAO,
  model: '',
  status: 'desconhecido'
};

let state = {
  pets: [], currentPage: 0, especieRaca: 'cao', buscaRaca: '', porteFiltro: 'todos',
  petSelecionado: null, saudeSub: 'visao', saudeBusca: '', guiaSub: 'alimentos',
  marcaVacinaSel: '', doencaEspecie: 'cao', doencaRiscoFiltro: 'todos',
  ultimaAtualizacao: null,
  chat: [], chatTyping: false
};

/* ============================================================
   PERSISTÊNCIA
============================================================ */
function saveDB(){
  try{
    state.ultimaAtualizacao = new Date().toISOString();
    localStorage.setItem(DB_KEY, JSON.stringify({pets: state.pets, ultimaAtualizacao: state.ultimaAtualizacao}));
    atualizarBadgeBackup();
  }catch(e){
    console.error('Erro ao salvar:', e);
    if(String(e).indexOf('QuotaExceeded') !== -1){
      toast('⚠️ Armazenamento cheio. Remova fotos antigas.');
    }
  }
}
function normalizarPet(p){
  if(!p.historico) p.historico = {consultas:[],exames:[],medicamentos:[],cirurgias:[],alergias:[]};
  if(!p.antipulgas) p.antipulgas = [];
  if(!p.diario) p.diario = [];
  if(!p.tutores) p.tutores = [];
  if(!p.vacinas) p.vacinas = {};
  if(!p.pesos) p.pesos = [];
  if(!p.cuidados) p.cuidados = [];
  if(!p.album) p.album = [];
  return p;
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d.pets)) state.pets = d.pets;
      if(d.ultimaAtualizacao) state.ultimaAtualizacao = d.ultimaAtualizacao;
    }
  }catch(e){ state.pets = []; }
  state.pets.forEach(normalizarPet);
}
function saveIAConfig(){ try{ localStorage.setItem(IA_CONFIG_KEY, JSON.stringify(iaConfig)); }catch(e){} }
function loadIAConfig(){
  try{
    const raw = localStorage.getItem(IA_CONFIG_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d.provider) iaConfig.provider = d.provider;
      if(d.apiKey) iaConfig.apiKey = d.apiKey;
      if(d.model !== undefined) iaConfig.model = d.model;
      if(d.status) iaConfig.status = d.status;
    }
  }catch(e){}
}
function saveChatHistory(){
  try{ localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(state.chat.slice(-40))); }catch(e){}
}
function loadChatHistory(){
  try{
    const raw = localStorage.getItem(CHAT_HISTORY_KEY);
    if(raw){ const d = JSON.parse(raw); if(Array.isArray(d)) state.chat = d; }
  }catch(e){}
}

/* ============================================================
   BACKUP
============================================================ */
function getBackups(){
  try{
    const raw = localStorage.getItem(BACKUP_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function setBackups(arr){ try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(arr)); }catch(e){} }
function fazerBackupAutomatico(motivo){
  const backups = getBackups();
  const backup = {
    id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    data: new Date().toISOString(),
    motivo: motivo || 'Automático',
    qtdPets: state.pets.length,
    tamanho: JSON.stringify(state.pets).length,
    dados: JSON.parse(JSON.stringify(state.pets))
  };
  backups.unshift(backup);
  while(backups.length > MAX_AUTO_BACKUPS) backups.pop();
  setBackups(backups);
  return backup;
}
function atualizarBadgeBackup(){
  const badge = $('#badgeBackup');
  if(!badge) return;
  const ultima = state.ultimaAtualizacao ? new Date(state.ultimaAtualizacao) : null;
  if(!ultima){ badge.style.display = 'block'; return; }
  const horas = (Date.now() - ultima.getTime()) / (1000 * 60 * 60);
  badge.style.display = horas > 24 ? 'block' : 'none';
}
function tempoRelativo(iso){
  if(!iso) return 'Nunca';
  const d = new Date(iso);
  const diff = Date.now() - d.getTime();
  const seg = Math.floor(diff/1000);
  const min = Math.floor(seg/60);
  const horas = Math.floor(min/60);
  const dias = Math.floor(horas/24);
  if(seg < 60) return 'Agora mesmo';
  if(min < 60) return min + ' min atrás';
  if(horas < 24) return horas + 'h atrás';
  if(dias === 1) return 'Ontem';
  if(dias < 7) return dias + ' dias atrás';
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
}
function formatarTamanho(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}

function abrirModalBackup(){
  const backups = getBackups();
  const totalPets = state.pets.length;
  const tamanho = JSON.stringify(state.pets).length;
  const ultima = state.ultimaAtualizacao;
  let html = `
    <div class="backup-status">
      <div class="bs-ic">💾</div>
      <div class="bs-body">
        <div class="bs-titulo">Dados salvos</div>
        <div class="bs-info">${totalPets} pet${totalPets !== 1 ? 's' : ''} · ${formatarTamanho(tamanho)}<br>Última: ${tempoRelativo(ultima)}</div>
      </div>
    </div>
    <button class="backup-opt" onclick="salvarAgora()">
      <div class="bo-ic" style="background:linear-gradient(135deg,#25C2B0,#4AD4C3);color:#fff">💾</div>
      <div class="bo-body"><div class="bo-titulo">Salvar agora</div><div class="bo-desc">Força o salvamento</div></div>
      <div class="bo-arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></div>
    </button>
    <button class="backup-opt" onclick="exportarBackup()">
      <div class="bo-ic" style="background:linear-gradient(135deg,#4A7DFF,#6B9BFF);color:#fff">📥</div>
      <div class="bo-body"><div class="bo-titulo">Exportar backup</div><div class="bo-desc">Baixa arquivo JSON</div></div>
      <div class="bo-arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></div>
    </button>
    <button class="backup-opt" onclick="abrirImport()">
      <div class="bo-ic" style="background:linear-gradient(135deg,#9B5DE5,#B585F0);color:#fff">📤</div>
      <div class="bo-body"><div class="bo-titulo">Importar backup</div><div class="bo-desc">Restaura de arquivo JSON</div></div>
      <div class="bo-arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></div>
    </button>`;
  if(backups.length > 0){
    html += `<div class="sec-head" style="margin-top:22px"><div class="sec-title"><span class="dot"></span>Backups automáticos</div></div>`;
    html += backups.map(b=>`
      <div class="backup-hist">
        <div class="bh-ic">🕒</div>
        <div class="bh-body">
          <div class="bh-data">${new Date(b.data).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</div>
          <div class="bh-info">${b.qtdPets} pets · ${formatarTamanho(b.tamanho)}</div>
        </div>
        <button class="bh-btn" onclick="restaurarBackup('${b.id}')">Restaurar</button>
        <button class="bh-btn del" onclick="excluirBackup('${b.id}')">
          <svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
      </div>`).join('');
  }
  html += `<div style="text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:16px">PetVida ${APP_VERSION} · ${APP_VERSION_DATE}</div>`;
  openModal(headPadrao('Backup e Restauração', 'Proteja os dados'), html,
    `<button class="btn btn-primary" onclick="closeModal()">Fechar</button>`);
}
function salvarAgora(){ saveDB(); toast('Dados salvos! ✅'); setTimeout(()=> abrirModalBackup(), 400); }
function exportarBackup(){
  try{
    const dados = {app:'PetVida', versao:APP_VERSION, exportadoEm:new Date().toISOString(), qtdPets:state.pets.length, pets:state.pets};
    const json = JSON.stringify(dados, null, 2);
    const blob = new Blob([json], {type: 'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `petvida-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    toast('Backup exportado! 📥');
  }catch(e){ toast('Erro ao exportar'); }
}
function abrirImport(){ $('#inputImport').click(); }
function processarImport(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 5 * 1024 * 1024){ toast('Arquivo muito grande'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const dados = JSON.parse(e.target.result);
      if(!dados.pets || !Array.isArray(dados.pets)){ toast('Arquivo inválido'); input.value = ''; return; }
      previewImport(dados, file.name);
    }catch(err){ toast('Erro ao ler arquivo'); }
    input.value = '';
  };
  reader.readAsText(file);
}
function previewImport(dados, nomeArq){
  const qtdPets = dados.pets.length;
  const petsAtuais = state.pets.length;
  fazerBackupAutomatico('Pré-importação');
  let lista = dados.pets.slice(0,5).map(p=>`<li>${p.emoji || '🐾'} <strong>${esc(p.nome)}</strong></li>`).join('');
  if(qtdPets > 5) lista += `<li>... e mais ${qtdPets-5}</li>`;
  openModal(headPadrao('Confirmar importação', 'Revise antes de restaurar'),
    `<div class="backup-status">
      <div class="bs-ic">📦</div>
      <div class="bs-body">
        <div class="bs-titulo">Backup encontrado</div>
        <div class="bs-info">${esc(nomeArq)}<br>${qtdPets} pet${qtdPets !== 1 ? 's' : ''}</div>
      </div>
    </div>
    <div class="blk"><h4><span class="b-ic">🐾</span>Pets</h4><ul style="margin-top:10px">${lista}</ul></div>
    <div class="blk warn"><h4><span class="b-ic">⚠️</span>Atenção</h4><p>Os <strong>${petsAtuais}</strong> pets atuais serão substituídos.</p></div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="confirmarImport(${JSON.stringify(JSON.stringify(dados))})">Restaurar</button>`);
}
function confirmarImport(dadosJson){
  try{
    const dados = JSON.parse(dadosJson);
    state.pets = dados.pets.map(normalizarPet);
    state.petSelecionado = state.pets[0] ? state.pets[0].id : null;
    saveDB(); closeModal(); toast('Backup restaurado! 🎉'); goTo(0); atualizarHeader();
  }catch(e){ toast('Erro ao restaurar'); }
}
function restaurarBackup(id){
  const backups = getBackups();
  const b = backups.find(x=>x.id === id);
  if(!b){ toast('Backup não encontrado'); return; }
  openModal(headPadrao('Restaurar backup', 'Confirmar restauração'),
    `<div class="backup-status">
      <div class="bs-ic">🕒</div>
      <div class="bs-body">
        <div class="bs-titulo">Backup selecionado</div>
        <div class="bs-info">${new Date(b.data).toLocaleString('pt-BR')}<br>${b.qtdPets} pets · ${b.motivo}</div>
      </div>
    </div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="confirmarRestauracaoBackup('${id}')">Restaurar</button>`);
}
function confirmarRestauracaoBackup(id){
  const backups = getBackups();
  const b = backups.find(x=>x.id === id);
  if(!b){ toast('Backup não encontrado'); return; }
  fazerBackupAutomatico('Pré-restauração');
  state.pets = JSON.parse(JSON.stringify(b.dados)).map(normalizarPet);
  state.petSelecionado = state.pets[0] ? state.pets[0].id : null;
  saveDB(); closeModal(); toast('Backup restaurado! 🎉'); goTo(0); atualizarHeader();
}
function excluirBackup(id){
  const backups = getBackups();
  setBackups(backups.filter(x=>x.id !== id));
  toast('Backup excluído');
  abrirModalBackup();
}

/* ============================================================
   UTILITÁRIOS
============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(str){
  return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtData(iso){
  if(!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function hojeISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addWeeks(date, weeks){ const d = new Date(date.getTime()); d.setDate(d.getDate() + weeks*7); return d; }
function diffDias(a, b){ return Math.round((a - b) / 86400000); }
function calcIdade(nascimento){
  if(!nascimento) return '—';
  const nasc = new Date(nascimento + 'T12:00:00');
  if(isNaN(nasc)) return '—';
  const hoje = new Date();
  let meses = (hoje.getFullYear()-nasc.getFullYear())*12 + (hoje.getMonth()-nasc.getMonth());
  if(hoje.getDate() < nasc.getDate()) meses--;
  if(meses < 0) meses = 0;
  const anos = Math.floor(meses/12);
  const m = meses % 12;
  if(meses < 1){ const dias = Math.max(0, diffDias(hoje, nasc)); return dias + (dias === 1 ? ' dia' : ' dias'); }
  if(anos === 0) return m + (m===1?' mês':' meses');
  if(m === 0) return anos + (anos===1?' ano':' anos');
  return anos + 'a ' + m + 'm';
}
function idadeHumana(pet){
  if(!pet.nascimento) return '—';
  const nasc = new Date(pet.nascimento + 'T12:00:00');
  const hoje = new Date();
  let meses = (hoje.getFullYear()-nasc.getFullYear())*12 + (hoje.getMonth()-nasc.getMonth());
  if(hoje.getDate() < nasc.getDate()) meses--;
  if(meses < 0) meses = 0;
  const anos = meses / 12;
  let humano = 0;
  if(pet.especie === 'gato'){
    if(anos <= 1) humano = anos * 15;
    else if(anos <= 2) humano = 15 + (anos - 1) * 9;
    else humano = 24 + (anos - 2) * 4;
  } else {
    const p = parseFloat(String(pet.peso||'').replace(',','.')) || 0;
    let mult = 5;
    if(p < 10) mult = 4;
    else if(p < 25) mult = 5;
    else if(p < 45) mult = 6;
    else mult = 7;
    if(anos <= 1) humano = anos * 15;
    else if(anos <= 2) humano = 15 + (anos - 1) * 9;
    else humano = 24 + (anos - 2) * mult;
  }
  return Math.round(humano) + ' anos';
}
function faixaEtaria(nascimento){
  const nasc = new Date(nascimento + 'T12:00:00');
  const meses = (new Date().getFullYear()-nasc.getFullYear())*12 + (new Date().getMonth()-nasc.getMonth());
  if(meses < 2) return 'filhote';
  if(meses < 12) return 'junior';
  if(meses < 84) return 'adulto';
  return 'senior';
}
function idadeDetalhada(pet){
  if(!pet.nascimento) return null;
  const nasc = new Date(pet.nascimento + 'T12:00:00');
  const hoje = new Date();
  let meses = (hoje.getFullYear()-nasc.getFullYear())*12 + (hoje.getMonth()-nasc.getMonth());
  if(hoje.getDate() < nasc.getDate()) meses--;
  if(meses < 0) meses = 0;
  const anos = Math.floor(meses/12);
  const mesesRestantes = meses % 12;
  let animalTxt = '';
  if(anos === 0 && mesesRestantes === 0){
    const dias = Math.max(0, diffDias(hoje, nasc));
    animalTxt = dias + (dias === 1 ? ' dia' : ' dias');
  } else if(anos === 0){
    animalTxt = mesesRestantes + (mesesRestantes === 1 ? ' mês' : ' meses');
  } else if(mesesRestantes === 0){
    animalTxt = anos + (anos === 1 ? ' ano' : ' anos');
  } else {
    animalTxt = anos + (anos === 1 ? ' ano' : ' anos') + ' e ' + mesesRestantes + (mesesRestantes === 1 ? ' mês' : ' meses');
  }
  return { meses, anos, mesesRestantes, animalTxt, humano: idadeHumana(pet), faixa: faixaEtaria(pet.nascimento) };
}
function calcularIdadeNaData(nascimento, dataFoto){
  if(!nascimento || !dataFoto) return '';
  const nasc = new Date(nascimento + 'T12:00:00');
  const data = new Date(dataFoto + 'T12:00:00');
  if(isNaN(nasc) || isNaN(data)) return '';
  let meses = (data.getFullYear()-nasc.getFullYear())*12 + (data.getMonth()-nasc.getMonth());
  if(data.getDate() < nasc.getDate()) meses--;
  if(meses < 0) return '';
  const anos = Math.floor(meses/12);
  const m = meses % 12;
  if(meses < 1){
    const dias = Math.max(0, Math.round((data-nasc)/86400000));
    return dias + (dias === 1 ? ' dia' : ' dias');
  }
  if(anos === 0) return m + (m===1?' mês':' meses');
  if(m === 0) return anos + (anos===1?' ano':' anos');
  return anos + 'a ' + m + 'm';
}

}
function gerarIdPet(pet){
  const base = (pet.nome||'PET').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,4).padEnd(4,'X');
  const hash = (pet.id||'0000').slice(-4).toUpperCase();
  return 'PET-' + base + '-' + hash;
}
function padraoQr(pet, size){
  const s = size || 74;
  const seed = (pet.id||'x').split('').reduce((a,c)=>a+c.charCodeAt(0), 0);
  let cells = '';
  const n = 11;
  const c = s / n;
  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const pseudo = Math.abs(Math.sin(seed + x*7 + y*13) * 10000) % 1;
      const isFinder = (x<3&&y<3)||(x>=n-3&&y<3)||(x<3&&y>=n-3);
      let fill = false;
      if(isFinder){ const fx = x<3?x:(x-(n-3)); const fy = y<3?y:(y-(n-3)); fill = !(fx===1 && fy===1); }
      else { fill = pseudo > 0.52; }
      if(fill) cells += `<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#1B2434"/>`;
    }
  }
  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg" style="background:#fff;border-radius:4px">${cells}</svg>`;
}

============================================================ */
function redimensionarImagem(dataUrl, maxSize, qualidade, cb){
  const img = new Image();
  img.onload = () => {
    let w = img.width, h = img.height;
    if(w > maxSize || h > maxSize){
      if(w > h){ h = Math.round(h * maxSize / w); w = maxSize; }
      else { w = Math.round(w * maxSize / h); h = maxSize; }
    }
    try{
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', qualidade));
    }catch(e){ cb(dataUrl); }
  };
  img.onerror = () => cb(dataUrl);
  img.src = dataUrl;
}

function processarPerguntaLocal(pergunta, petCtx){
  const t = (pergunta || '').toLowerCase().trim();
  if(!t) return null;
  const tokens = t.split(/\s+/);
  let melhor = null, melhorScore = 0;
  IA_KB.forEach(item=>{
    let score = 0;
    item.palavras.forEach(p=>{
      if(t.includes(p.toLowerCase())) score += (p.split(' ').length > 1 ? 2 : 1) * (item.peso || 1);
      else tokens.forEach(tk=>{ if(tk.length > 3 && p.toLowerCase().includes(tk)) score += 0.5 * (item.peso || 1); });
    });
    if(score > melhorScore){ melhorScore = score; melhor = item; }
  });
  if(!melhor || melhorScore < 1) return gerarRespostaGenerica(pergunta, petCtx);
  return {texto: melhor.resposta, tipo: melhor.tipo, fonte:'local'};
}

function gerarRespostaGenerica(pergunta, petCtx){
  let ctx = '';
  if(petCtx) ctx = `\n\n💡 **Sobre ${petCtx.nome}** (${petCtx.raca || 'SRD'}, ${petCtx.idade}):`;

    tipo: 'info',
    fonte: 'local'
  };
}

let modelosDisponiveisCache = null;
let cacheTimestamp = 0;
const CACHE_DURACAO = 10 * 60 * 1000;

async function descobrirModelosDisponiveis(chaveLimpa){
  const agora = Date.now();
  if(modelosDisponiveisCache && (agora - cacheTimestamp) < CACHE_DURACAO){
    return modelosDisponiveisCache;
  }
  try{
    console.log('🔍 Listando modelos disponíveis...');
    const url = 'https://generativelanguage.googleapis.com/v1beta/models';
    const res = await fetch(url, {method:'GET', headers:{'x-goog-api-key': chaveLimpa}});
    if(!res.ok){
      console.warn('⚠️ Não foi possível listar modelos:', res.status);
      return null;
    }
    const data = await res.json();
    if(!data.models || !Array.isArray(data.models)) return null;
    const modelos = data.models
      .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
      .map(m => ({nome: m.name.replace('models/', ''), displayName: m.displayName || m.name, descricao: m.description || ''}));
    console.log('✅ Modelos encontrados:', modelos.map(m => m.nome).join(', '));
    modelosDisponiveisCache = modelos;
    cacheTimestamp = agora;
    return modelos;
  }catch(e){
    console.warn('⚠️ Erro ao listar modelos:', e.message);
    return null;
  }
}

function ordenarModelosPorPreferencia(modelos){
  if(!modelos) return [];
  const prioridades = [
    {match: /^gemini-3\.6-flash$/i, peso: 100},
    {match: /^gemini-3\.5-flash$/i, peso: 95},
    {match: /^gemini-3\.[0-9]+-flash$/i, peso: 90},
    {match: /^gemini-3\.1-pro$/i, peso: 85},
    {match: /^gemini-3\.[0-9]+-pro$/i, peso: 80},
    {match: /^gemini-2\.5-flash$/i, peso: 75},
    {match: /^gemini-2\.0-flash$/i, peso: 70},
    {match: /^gemini-2\.5-pro$/i, peso: 65},
    {match: /^gemini-2\.0-flash-lite$/i, peso: 60},
    {match: /^gemini-3\.[0-9]+-flash-lite$/i, peso: 55},
    {match: /^gemini-1\.5-flash-latest$/i, peso: 50},
    {match: /^gemini-1\.5-pro-latest$/i, peso: 45},
    {match: /flash/i, peso: 30},
    {match: /pro/i, peso: 25},
    {match: /lite/i, peso: 20},
    {match: /gemini/i, peso: 10}
  ];
  return modelos.slice().sort((a, b) => {
    const pesoA = prioridades.reduce((max, p) => p.match.test(a.nome) ? Math.max(max, p.peso) : max, 0);
    const pesoB = prioridades.reduce((max, p) => p.match.test(b.nome) ? Math.max(max, p.peso) : max, 0);
    return pesoB - pesoA;
  });
}

async function chamarIAReal(pergunta, petCtx){
  const cfg = iaConfig;
  if(!cfg.apiKey || cfg.provider === 'local') return null;
  const chaveLimpa = (cfg.apiKey || '').trim();
  if(!chaveLimpa) return null;

  const sysPrompt = `Você é o Dr. Pet IA, assistente veterinário inteligente, amigável e completo.

DIRETRIZES:
- Responda SEMPRE em português do Brasil, com clareza, empatia e riqueza de detalhes
- Use **negrito** para destaques, listas numeradas e bullets quando ajudar a leitura
- Seja completo: responda até o fim sem cortar a informação
- Você TEM acesso à pesquisa do Google — use quando precisar de dados atuais
- Em EMERGÊNCIAS, oriente procurar veterinário IMEDIATAMENTE com destaque
- Nunca prescreva doses exatas de medicamentos — oriente procurar o vet
- Termine respostas médicas com um lembrete curto: "⚠️ Consulte um veterinário para avaliação presencial."

${petCtx ? `CONTEXTO DO PET ATUAL:\n- Nome: ${petCtx.nome}\n- Espécie: ${petCtx.especie}\n- Raça: ${petCtx.raca || 'SRD'}\n- Idade: ${petCtx.idade}\n- Peso: ${petCtx.peso || 'não informado'}` : 'Nenhum pet cadastrado ainda.'}`;

  if(cfg.provider === 'openai' || cfg.provider === 'anthropic'){
    return chamarIAProvedorAlternativo(pergunta, sysPrompt, chaveLimpa);
  }

  let modelosParaTentar = [];
  if(cfg.model && cfg.model.trim()) modelosParaTentar.push(cfg.model.trim());
  const disponiveis = await descobrirModelosDisponiveis(chaveLimpa);
  if(disponiveis && disponiveis.length > 0){
    const ordenados = ordenarModelosPorPreferencia(disponiveis);
    ordenados.forEach(m => { if(!modelosParaTentar.includes(m.nome)) modelosParaTentar.push(m.nome); });
  }
  const fallback = [
    'gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite',
    'gemini-3.1-pro', 'gemini-3.0-flash', 'gemini-2.5-flash',
    'gemini-2.0-flash', 'gemini-2.0-flash-lite',
    'gemini-1.5-flash-latest', 'gemini-1.5-pro-latest'
  ];
  fallback.forEach(m => { if(!modelosParaTentar.includes(m)) modelosParaTentar.push(m); });

  console.log('🎯 Modelos:', modelosParaTentar.slice(0, 6).join(' → '));
  let ultimoErro = null;

  for(const modelo of modelosParaTentar){
    console.log(`🌐 Tentando ${modelo} COM pesquisa na internet...`);

    // Tenta PRIMEIRO com Google Search Grounding
    let r = await tentarChamarModelo(modelo, chaveLimpa, sysPrompt, pergunta, true);

    // Se erro 400 (modelo não aceita grounding), retry sem ele
    if(r && r.erro && r.statusCode === 400){
      console.log(`   🔄 ${modelo}: grounding rejeitado, tentando sem...`);
      r = await tentarChamarModelo(modelo, chaveLimpa, sysPrompt, pergunta, false);
    }

    if(r && r.erro && (r.statusCode === 429 || r.statusCode === 401 || r.statusCode === 403)){
      return r;
    }
    if(r && r.statusCode === 404){ ultimoErro = r; continue; }
    if(r && r.erro){ ultimoErro = r; continue; }

    if(r && r.texto){
      console.log(`   ✅ Sucesso com ${modelo}${r.comGrounding ? ' + 🌐 pesquisa' : ''}!`);
      if(iaConfig.model !== modelo){ iaConfig.model = modelo; saveIAConfig(); }
      return r;
    }
  }
  return ultimoErro || {erro: true, motivo: 'Nenhum modelo disponível', statusCode: 404};
}

async function tentarChamarModelo(modelo, chaveLimpa, sysPrompt, pergunta, usarGrounding){
  try{
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent`;

    const body = {
      contents: [{role:'user', parts:[{text: sysPrompt + '\n\n---\n\nPERGUNTA DO TUTOR:\n' + pergunta}]}],
      generationConfig: {
        maxOutputTokens: 3000,
        temperature: 0.9,
        topP: 0.95,
        topK: 40
      },
      safetySettings: [
        {category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_NONE'},
        {category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_NONE'},
        {category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_NONE'},
        {category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_NONE'}
      ]
    };

    if(usarGrounding){
      body.tools = [{google_search: {}}];
    }

    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-goog-api-key': chaveLimpa},
      body: JSON.stringify(body)
    });

    if(res.status === 404) return {erro: true, motivo: 'Modelo não disponível', statusCode: 404};
    if(res.status === 429) return {erro: true, motivo: 'Cota excedida', statusCode: 429};
    if(res.status === 401 || res.status === 403) return {erro: true, motivo: 'Chave inválida', statusCode: res.status};
    if(!res.ok){
      const errTxt = await res.text();
      console.warn(`   ⚠️ HTTP ${res.status}:`, errTxt.slice(0, 150));
      return {erro: true, motivo: 'HTTP ' + res.status, statusCode: res.status};
    }

    const data = await res.json();

    if(data.promptFeedback && data.promptFeedback.blockReason){
      return {erro: true, motivo: 'Pergunta bloqueada pelo filtro', statusCode: 400};
    }

    let texto = '';
    let finishReason = '';
    let fontes = [];

    if(data.candidates && data.candidates[0]){
      const cand = data.candidates[0];
      finishReason = cand.finishReason || '';
      if(cand.content && cand.content.parts){
        texto = cand.content.parts.map(p => p.text || '').join('');
      }
      if(cand.groundingMetadata && cand.groundingMetadata.groundingChunks){
        fontes = cand.groundingMetadata.groundingChunks
          .filter(c => c.web)
          .map(c => ({
            titulo: (c.web.title || 'Fonte').replace(/[\[\]]/g,''),
            uri: c.web.uri || ''
          }))
          .filter(f => f.uri);
      }
    }

    if(!texto) return {erro: true, motivo: 'Resposta vazia', statusCode: 200};

    let aviso = '';
    if(finishReason === 'MAX_TOKENS') aviso = '\n\n---\n_⚠️ Resposta longa cortada. Peça para continuar se necessário._';
    else if(finishReason === 'SAFETY') aviso = '\n\n---\n_⚠️ Parte do conteúdo foi filtrada pelos filtros de segurança._';

    const emg = temEmergencia(pergunta);

    let textoFinal = texto.trim() + aviso;
    if(usarGrounding && fontes.length > 0){
      const lista = fontes.slice(0, 3).map(f => {
        let dominio = '';
        try{ dominio = new URL(f.uri).hostname.replace('www.',''); }catch(e){}
        return `• [${f.titulo}](${f.uri})${dominio ? ' — _' + dominio + '_' : ''}`;
      }).join('\n');
      textoFinal += '\n\n**🔗 Fontes pesquisadas:**\n' + lista;
    }

    return {
      texto: textoFinal,
      tipo: emg ? 'emergencia' : 'ia-real',
      real: true,
      fonte: 'ia-real',
      modelo: modelo,
      comGrounding: usarGrounding && fontes.length > 0,
      finishReason: finishReason
    };

  }catch(e){
    console.error(`   ❌ Rede ${modelo}:`, e.message);
    return {erro: true, motivo: 'Falha de rede: ' + e.message, statusCode: 0};
  }
}

async function chamarIAProvedorAlternativo(pergunta, sysPrompt, chaveLimpa){
  const cfg = iaConfig;
  try{
    let url = '', headers = {'Content-Type':'application/json'}, body = {};
    if(cfg.provider === 'openai'){
      url = 'https://api.openai.com/v1/chat/completions';
      headers['Authorization'] = `Bearer ${chaveLimpa}`;
      body = {model: cfg.model || 'gpt-4o-mini', messages: [{role:'system', content: sysPrompt},{role:'user', content: pergunta}], max_tokens: 3000, temperature: 0.9};
    } else if(cfg.provider === 'anthropic'){
      url = 'https://api.anthropic.com/v1/messages';
      headers['x-api-key'] = chaveLimpa;
      headers['anthropic-version'] = '2023-06-01';
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
      body = {model: cfg.model || 'claude-3-5-sonnet-20241022', max_tokens: 3000, system: sysPrompt, messages: [{role:'user', content: pergunta}]};
    }
    const res = await fetch(url, {method:'POST', headers, body: JSON.stringify(body)});
    if(!res.ok){
      let motivo = res.status === 401 || res.status === 403 ? 'Chave inválida' : res.status === 429 ? 'Cota excedida' : 'Erro HTTP ' + res.status;
      return {erro: true, motivo, statusCode: res.status};
    }
    const data = await res.json();
    let texto = cfg.provider === 'openai'
      ? (data.choices?.[0]?.message?.content || '')
      : (data.content?.[0]?.text || '');
    if(!texto) return {erro: true, motivo: 'Resposta vazia', statusCode: 200};
    const emg = temEmergencia(pergunta);
    return {texto: texto.trim(), tipo: emg ? 'emergencia' : 'ia-real', real: true, fonte: 'ia-real'};
  }catch(e){
    return {erro: true, motivo: 'Falha de rede: ' + e.message, statusCode: 0};
  }
}

function temEmergencia(texto){
  const pal = ['emergência','emergencia','socorro','urgente','morrendo','atropelado','convulsionando','intoxicado','envenenado','sangrando muito','não respira','engasgado','sufocando'];
  const t = texto.toLowerCase();
  return pal.some(p => t.includes(p));
}

function rotuloTipo(t, fonte, comWeb){
  if(t === 'ia-real') return comWeb ? '✨ IA Gemini + 🌐 Web' : '✨ IA Gemini';
  const m = {info:'Informativo', alerta:'Atenção', dica:'Dica', emergencia:'Emergência'};
  const base = m[t] || 'Info';
  if(fonte === 'local') return base + ' · Base local';
  return base;
}

function formatarMensagem(texto){
  let t = esc(texto);
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/_([^_]+)_/g, '<em style="opacity:.75">$1</em>');
  // Renderiza links markdown [texto](url)
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#9B5DE5;text-decoration:underline;font-weight:600">$1</a>');
  t = t.replace(/`([^`]+)`/g, '<code style="background:#F1F4F9;padding:1px 5px;border-radius:4px;font-size:12px">$1</code>');
  t = t.replace(/\n/g, '<br>');
  t = t.replace(/^(<br>)+/, '');
  return t;
}

function autoResizeChat(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

async function enviarMensagem(){
  const inp = $('#chatInput');
  const txt = (inp.value || '').trim();
  if(!txt || state.chatTyping) return;

  inp.value = '';
  autoResizeChat(inp);

  state.chat.push({role:'user', texto: txt, hora: agoraHHMM()});
  state.chatTyping = true;
  renderChat();
  saveChatHistory();

  const pet = state.pets.find(p => p.id === state.petSelecionado) || state.pets[0];
  const petCtx = pet ? {
    nome: pet.nome,
    especie: pet.especie === 'gato' ? 'Gato' : 'Cão',
    raca: pet.raca,
    idade: calcIdade(pet.nascimento),
    peso: pet.peso
  } : null;

  try{
    let resposta = null;
    if(iaConfig.provider !== 'local' && iaConfig.apiKey){
      const resultado = await chamarIAReal(txt, petCtx);
      if(resultado && resultado.erro){
        iaConfig.status = 'erro';
        saveIAConfig();
        toast('⚠️ IA: ' + resultado.motivo);
      } else if(resultado){
        iaConfig.status = 'ok';
        saveIAConfig();
        resposta = resultado;
      }
    }
    if(!resposta){
      await new Promise(r => setTimeout(r, 300));
      resposta = processarPerguntaLocal(txt, petCtx);
      if(resposta && !resposta.tipo) resposta.tipo = 'info';
      if(resposta && !resposta.fonte) resposta.fonte = 'local';
    }
    state.chat.push({
      role: 'ia',
      texto: resposta.texto,
      tipo: resposta.tipo,
      fonte: resposta.fonte,
      comGrounding: resposta.comGrounding || false,
      hora: agoraHHMM()
    });
  }catch(e){
    console.error(e);
    state.chat.push({role: 'ia', texto: '❌ Erro ao processar. Tente novamente.', tipo: 'alerta', hora: agoraHHMM()});
  } finally {
    state.chatTyping = false;
    renderChat();
    saveChatHistory();
  }
}

async function testarConexaoIA(){
  const prov = $('#iaProvider') ? $('#iaProvider').value : 'gemini';
  const key = ($('#iaApiKey') ? $('#iaApiKey').value : '').trim();
  const model = ($('#iaModel') ? $('#iaModel').value : '').trim();

  if(!key){ mostrarResultadoTeste(false, 'Informe a chave de API'); return; }

  mostrarResultadoTeste(null, 'Testando conexão com pesquisa na web...');
  modelosDisponiveisCache = null;
  cacheTimestamp = 0;

  const backup = {...iaConfig};
  iaConfig.provider = prov;
  iaConfig.apiKey = key;
  iaConfig.model = model;

  try{
    const res = await chamarIAReal('Qual é a data de hoje no Brasil? Responda em uma linha curta.', null);
    if(res && res.erro){
      mostrarResultadoTeste(false, res.motivo);
      iaConfig = backup;
      saveIAConfig();
    } else if(res && res.texto){
      const modeloUsado = res.modelo || iaConfig.model || 'modelo detectado';
      const webTxt = res.comGrounding ? ' + 🌐 pesquisa na internet' : '';
      mostrarResultadoTeste(true, 'Conexão OK! Modelo: ' + modeloUsado + webTxt + ' · Resposta: "' + res.texto.slice(0, 80) + '..."');
      iaConfig.status = 'ok';
      saveIAConfig();
      renderChat();
    } else {
      mostrarResultadoTeste(false, 'Resposta vazia');
      iaConfig = backup;
      saveIAConfig();
    }
  }catch(e){
    mostrarResultadoTeste(false, 'Erro: ' + e.message);
    iaConfig = backup;
    saveIAConfig();
  }
}

function mostrarResultadoTeste(sucesso, msg){
  const el = $('#iaTesteResult');
  if(!el) return;
  if(sucesso === null){
    el.innerHTML = `<div style="padding:12px 14px;border-radius:12px;background:#F1F4F9;color:#5A6478;font-size:12px;font-weight:700;margin-top:10px">⏳ Testando conexão...</div>`;
  } else if(sucesso){
    el.innerHTML = `<div style="padding:12px 14px;border-radius:12px;background:var(--secondary-soft);color:#12897A;font-size:12px;font-weight:700;margin-top:10px;line-height:1.5">✅ ${esc(msg)}</div>`;
  } else {

  }
}

(function swipeInit(){
  const sw = $('#swiper');
  let x0=0, y0=0, ativo=false;
  sw.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1) return;
    if(e.target.closest('.chat-body') || e.target.closest('.chat-suggestions') || e.target.closest('.chat-input')) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; ativo = true;
  }, {passive:true});
  sw.addEventListener('touchend', e=>{
    if(!ativo) return; ativo = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if(Math.abs(dx) > 62 && Math.abs(dx) > Math.abs(dy) * 1.6){
      if(dx < 0) goTo(Math.min(7, state.currentPage + 1));
      else goTo(Math.max(0, state.currentPage - 1));
    }
  }, {passive:true});
})();

/* ============================================================
   STATUS VACINAL
============================================================ */
function normalizarVacina(v){
  if(!v) return null;
  if(typeof v === 'string') return {data: v, marca:'', lote:'', vet:'', clinica:'', obs:''};
  return v;
}
function statusVacina(pet, v){
  const raw = pet.vacinas && pet.vacinas[v.id];
  const aplicada = normalizarVacina(raw);
  const nasc = new Date(pet.nascimento + 'T12:00:00');
  const due = addWeeks(nasc, v.sem);
  const hoje = new Date(); hoje.setHours(12,0,0,0);
  if(aplicada) return {status:'ok', aplicada, due};
  const d = diffDias(due, hoje);
  if(d < 0) return {status:'atrasada', due, dias: Math.abs(d)};
  if(d <= 30) return {status:'proxima', due, dias: d};
  return {status:'futura', due, dias: d};
}
function resumoVacinas(pet){
  const lista = PROTOCOLO[pet.especie] || [];
  let ok=0, atrasada=0, proxima=0, futura=0;
  lista.forEach(v=>{
    const s = statusVacina(pet, v).status;
    if(s==='ok') ok++; else if(s==='atrasada') atrasada++;
    else if(s==='proxima') proxima++; else futura++;
  });
  return {total:lista.length, ok, atrasada, proxima, futura};
}

          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>

      </div>

  } else {
    html += `<div class="next-card anim" style="background:linear-gradient(140deg,#F3EAFE,#E9DDFB);border-color:#D9C4F5" onclick="goTo(7)">
      <div class="next-icon" style="background:rgba(155,93,229,.20)">🤖</div>
      <div class="next-body">
        <div class="next-label" style="color:#6B31B8">Dr. Pet IA + 🌐 Web</div>
        <div class="next-title">Dúvidas sobre seu pet?</div>

        <div class="next-date" style="color:#6B31B8">Toque para conversar →</div>

    </div>`;

  html += `<div class="sec-head"><div class="sec-title"><span class="dot"></span>Meus Pets</div>

  html += pets.slice(0,3).map((p,i)=> petCardHTML(p, i)).join('');
  html += `<div class="sec-head"><div class="sec-title"><span class="dot"></span>Ações rápidas</div></div>

}

  if(state.pets.length === 0){ toast('Cadastre um pet primeiro'); return; }
